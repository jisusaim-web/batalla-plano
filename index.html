<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalla en el plano</title>
<style>
:root{--bg:#e8eef0;--card:#f6f9fa;--ink:#10303a;--mut:#5d7882;--line:#a9bec5;--acc:#0f6b7a;--on:#fff;--err:#b3261e;--ok:#2e7d32;--off:#d3dfe3;--azul:#1f6fd1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1d22;--card:#14292f;--ink:#dcebef;--mut:#8fa9b1;--line:#2c474f;--acc:#4fb3c6;--on:#06222a;--err:#ff8a80;--ok:#81c784;--off:#0f2227;--azul:#5aa9ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font:700 1.15rem Georgia,serif;margin:0}
h2{font:600 1.05rem Georgia,serif;margin:18px 0 8px}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.big{display:block;width:100%;padding:16px;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
input{width:100%;padding:11px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{padding:10px 14px;font:inherit;font-weight:600;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:var(--on);cursor:pointer}
button.sec{background:transparent;color:var(--acc)}
button.mini{padding:6px 10px;font-size:.85rem}
button.link{border:0;background:none;color:var(--acc);text-decoration:underline;padding:6px 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:700 1.6rem Georgia,serif}
.stats span,small,.mut{color:var(--mut);font-size:.85rem}
.err{color:var(--err);min-height:1.3em;margin:8px 0 0;font-size:.9rem}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;overflow:hidden;padding:0;border:0}
.avt{overflow:hidden}
.ph{background-size:cover;background-position:center;min-height:132px}
.code{font:700 2rem ui-monospace,Menlo,monospace;letter-spacing:.2em}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
nav{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:0}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:4px;left:55%;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:.65rem;display:grid;place-items:center;padding:0 4px}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
details.h{border-bottom:1px solid var(--line);padding:8px 0}details.h:last-child{border:0}
.history-scroll{max-height:min(52vh,460px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:6px}
.history-scroll:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.history-scroll::-webkit-scrollbar{width:8px}.history-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.history-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:7px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.history-pager button{min-width:42px;padding:7px 12px}.history-pager button:disabled{opacity:.35;cursor:not-allowed}
.history-page-label{flex:1;text-align:center;font-size:.85rem;color:var(--mut)}.history-page-label b{display:block;color:var(--ink);font-size:.9rem}
.win{color:var(--ok)}.lose{color:var(--err)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}.bar b{color:var(--ink)}
.rad{margin:6px 0}
#splash{position:fixed;inset:0;z-index:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#16414d,#071419 72%);color:#dcebef;transition:opacity .6s,filter .6s,transform .6s}
#splash.dif{filter:blur(7px) brightness(.75);transform:scale(1.05)}
#splash.fuera{opacity:0;pointer-events:none}
.radar{width:150px;height:150px;margin:0 auto 12px}
.sweep{animation:giro 2.4s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.load{width:160px;height:4px;border-radius:2px;background:#ffffff26;margin:16px auto 0;overflow:hidden}
.load i{display:block;height:100%;width:40%;background:#EFE9DC;animation:barra 1.2s ease-in-out infinite}
@keyframes barra{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.sweep,.load i{animation:none}}
#auth{padding-top:10vh}
.glass{background:color-mix(in srgb,var(--card) 82%,transparent)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.centro{display:flex;flex-direction:column;gap:12px;text-align:center;padding:26px 0 18px}
.o{color:var(--mut);font-size:.85rem}
.dot2{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block;margin-right:8px}.on2{background:var(--ok)}
.frac{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:2px}
.fr{display:flex;flex-direction:column;align-items:center;width:92px}
.fr input{text-align:center}
/* Teclado numérico del juego */
.keypad{margin:10px 0 14px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.keypad-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:.85rem;color:var(--mut)}
.keypad-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.keypad-grid button{min-height:46px;font-size:1.1rem;padding:8px}
.keypad-grid button.kwide{font-size:.9rem}
.keypad-grid button.kclear{background:transparent;color:var(--acc)}
.keypad-grid button:active{filter:brightness(.88);transform:scale(.98)}
.fr hr{width:100%;border:0;border-top:3px solid var(--ink);margin:5px 0}
.reacs{display:flex;gap:6px;flex-wrap:wrap;min-height:1.7rem;margin:6px 0}
.reac{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:1.05rem}
button.emo{font-size:1.5rem;padding:6px 12px}
.ph{position:relative;overflow:hidden;min-height:92px;border:2px solid transparent;transition:filter .2s,box-shadow .2s}
.ph .avt{position:relative;z-index:1}
.ph .profile-copy{position:relative;z-index:1;min-width:0}
.ph .pn{overflow-wrap:anywhere}
.ph .featured{display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:2px 8px;border-radius:99px;background:#ffffff26;border:1px solid #ffffff55;font-size:.76rem}
.ph.frame-bronce{border-color:#cd8b55}.ph.frame-plata{border-color:#cbd5e1;box-shadow:0 0 0 2px #cbd5e155 inset}
.ph.frame-oro{border-color:#ffd166;box-shadow:0 0 12px #ffd16688,inset 0 0 0 2px #ffd16655}
.ph.frame-diamante{border-color:#7de8ff;box-shadow:0 0 16px #7de8ff99,inset 0 0 0 2px #7de8ff55}
.ph.frame-fuego{border-color:#ff7043;box-shadow:0 0 16px #ff572288,inset 0 0 0 2px #ff704355}
.ph.effect-brillo:after,.ph.effect-oleaje:after,.ph.effect-estrellas:after{content:"";position:absolute;inset:-60%;pointer-events:none;opacity:.22}
.ph.effect-brillo:after{background:linear-gradient(115deg,transparent 40%,#fff 50%,transparent 60%);animation:perfilBrillo 5s linear infinite}
.ph.effect-oleaje:after{background:radial-gradient(ellipse at 20% 120%,#fff8,transparent 55%),radial-gradient(ellipse at 80% -20%,#6ff8,transparent 55%);animation:perfilOleaje 4s ease-in-out infinite alternate}
.ph.effect-estrellas:after{background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff9 1px,transparent 1.5px);background-size:28px 28px,43px 43px;background-position:0 0,13px 17px;animation:perfilEstrellas 8s linear infinite}
@keyframes perfilBrillo{to{transform:translateX(45%)}}
@keyframes perfilOleaje{to{transform:translateY(-8px)}}
@keyframes perfilEstrellas{to{background-position:28px 28px,56px 60px}}


/* Decoraciones globales: cubren cabecera, tarjetas, logros, estadísticas e historial */
.profile-decor-shell{position:relative;isolation:isolate;padding:12px;border:3px solid transparent;border-radius:20px;margin:4px -4px 14px;overflow:hidden;transition:box-shadow .3s,border-color .3s}
.profile-decor-shell>*:not(.profile-decor-layer):not(.profile-bg-layer){position:relative;z-index:1}
.profile-bg-layer{position:absolute!important;z-index:0!important;inset:0;pointer-events:none;opacity:1;border-radius:inherit;background-size:cover;background-position:center}
.profile-decor-layer{position:absolute!important;z-index:0!important;inset:0;pointer-events:none;opacity:.22;border-radius:inherit}
.profile-decor-shell>.card{background:color-mix(in srgb,var(--card) 91%,transparent);backdrop-filter:blur(2px)}
.profile-decor-shell.frame-bronce{border-color:#cd8b55;box-shadow:0 0 0 2px #cd8b5544,0 8px 25px #8b451333}
.profile-decor-shell.frame-plata{border-color:#cbd5e1;box-shadow:0 0 0 3px #cbd5e155,0 8px 25px #94a3b833}
.profile-decor-shell.frame-oro{border-color:#ffd166;box-shadow:0 0 0 3px #ffd16666,0 0 25px #ffd16666}
.profile-decor-shell.frame-diamante{border-color:#7de8ff;box-shadow:0 0 0 3px #7de8ff77,0 0 30px #7de8ff66}
.profile-decor-shell.frame-fuego{border-color:#ff7043;box-shadow:0 0 0 3px #ff704355,0 0 28px #ff572266}
.profile-decor-shell.frame-obsidiana{border-color:#8270a8;box-shadow:inset 0 0 0 2px #c4b5fd55,0 0 25px #5b21b655}
.profile-decor-shell.frame-esmeralda{border-color:#34d399;box-shadow:inset 0 0 0 2px #a7f3d055,0 0 24px #05966966}
.profile-decor-shell.frame-rubi{border-color:#fb7185;box-shadow:inset 0 0 0 2px #fecdd355,0 0 25px #e11d4866}
.profile-decor-shell.frame-zafiro{border-color:#60a5fa;box-shadow:inset 0 0 0 2px #bfdbfe55,0 0 25px #2563eb66}
.profile-decor-shell.frame-arcoiris{border:4px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(120deg,red,#ff0,#0f0,#0ff,#00f,#f0f,red) border-box}
.profile-decor-shell.frame-cosmico{border-color:#c084fc;box-shadow:0 0 0 3px #c084fc55,0 0 35px #7e22ce77}
.profile-decor-shell.frame-electrico{border-color:#facc15;box-shadow:0 0 0 2px #facc1566,0 0 28px #eab30877}
.profile-decor-shell.frame-hielo{border-color:#a5f3fc;box-shadow:inset 0 0 20px #67e8f955,0 0 25px #22d3ee66}
.profile-decor-shell.frame-corona{border:4px double #fcd34d;box-shadow:0 0 0 2px #92400e55,0 0 30px #f59e0b66}
.profile-decor-shell.frame-glitch{border-color:#f0abfc;box-shadow:5px 0 #22d3ee55,-5px 0 #f43f5e55,0 0 25px #d946ef66}
.profile-decor-shell.frame-dragon{border-color:#f97316;box-shadow:inset 0 0 24px #dc262644,0 0 30px #ea580c77}
.profile-decor-shell.effect-brillo .profile-decor-layer{background:linear-gradient(115deg,transparent 35%,#fff 50%,transparent 65%);background-size:220% 100%;animation:globalShine 5s linear infinite}
.profile-decor-shell.effect-oleaje .profile-decor-layer{background:radial-gradient(ellipse at 15% 100%,#38bdf866,transparent 45%),radial-gradient(ellipse at 90% 0%,#a78bfa66,transparent 48%);animation:globalFloat 5s ease-in-out infinite alternate}
.profile-decor-shell.effect-estrellas .profile-decor-layer{background-image:radial-gradient(#fff 1px,transparent 1.8px),radial-gradient(#fff9 1px,transparent 1.8px);background-size:25px 25px,43px 43px;animation:globalStars 10s linear infinite}
.profile-decor-shell.effect-particulas .profile-decor-layer{background-image:radial-gradient(circle,#fff 1px,transparent 2px),radial-gradient(circle,#7dd3fc 2px,transparent 3px);background-size:37px 41px,61px 67px;animation:globalStars 12s linear infinite}
.profile-decor-shell.effect-pulso{animation:globalPulse 3s ease-in-out infinite}
.profile-decor-shell.effect-aurora .profile-decor-layer{background:linear-gradient(120deg,#22d3ee55,#a78bfa66,#4ade8055,#f0abfc55);background-size:250% 250%;animation:globalAurora 8s ease infinite}
.profile-decor-shell.effect-lluvia .profile-decor-layer{background:repeating-linear-gradient(110deg,transparent 0 18px,#7dd3fc66 19px 20px,transparent 21px 35px);animation:globalRain 1.5s linear infinite}
.profile-decor-shell.effect-ondas .profile-decor-layer{background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 18px,#fff4 19px 20px,transparent 21px 35px);animation:globalWave 8s linear infinite}
.profile-decor-shell.effect-fuego .profile-decor-layer{background:radial-gradient(ellipse at 10% 100%,#fb923c88,transparent 35%),radial-gradient(ellipse at 90% 100%,#ef444488,transparent 35%);animation:globalFire 2s ease-in-out infinite alternate}
.profile-decor-shell.effect-holograma .profile-decor-layer{background:repeating-linear-gradient(0deg,#22d3ee22 0 2px,transparent 3px 7px),linear-gradient(120deg,#a78bfa33,#22d3ee33,#f0abfc33)}
.profile-decor-shell.effect-confeti .profile-decor-layer{background-image:radial-gradient(#f472b6 2px,transparent 3px),radial-gradient(#facc15 2px,transparent 3px),radial-gradient(#38bdf8 2px,transparent 3px);background-size:43px 51px,61px 57px,73px 67px;animation:globalStars 9s linear infinite}
.profile-decor-shell.effect-electricidad .profile-decor-layer{background:repeating-linear-gradient(125deg,transparent 0 32px,#fde04777 33px 35px,transparent 36px 57px);animation:globalRain 2s linear infinite}
.profile-decor-shell.effect-nebulosa .profile-decor-layer{background:radial-gradient(ellipse at 20% 20%,#c084fc77,transparent 40%),radial-gradient(ellipse at 80% 70%,#60a5fa77,transparent 45%),radial-gradient(ellipse at 40% 90%,#f472b677,transparent 40%);animation:globalAurora 10s ease infinite}
.profile-decor-shell.effect-matrix .profile-decor-layer{background:repeating-linear-gradient(0deg,transparent 0 12px,#4ade8033 13px 14px);animation:globalRain 1s linear infinite}
.profile-decor-shell.effect-cometa .profile-decor-layer{background:linear-gradient(120deg,transparent 20%,#fff8 48%,transparent 52%);background-size:250% 100%;animation:globalShine 3s linear infinite}
.profile-decor-shell.effect-prisma .profile-decor-layer{background:linear-gradient(120deg,#f472b633,#60a5fa33,#4ade8033,#facc1533);background-size:300% 300%;animation:globalAurora 6s ease infinite}
@keyframes globalShine{to{background-position:-220% 0}}
@keyframes globalFloat{to{transform:translateY(-10px) scale(1.02)}}
@keyframes globalStars{to{background-position:70px 90px,100px 120px}}
@keyframes globalPulse{50%{box-shadow:0 0 28px #a78bfa55}}
@keyframes globalAurora{50%{background-position:100% 100%}}
@keyframes globalRain{to{background-position:0 90px}}
@keyframes globalWave{to{background-position:100px 70px}}
@keyframes globalFire{to{opacity:.42;filter:hue-rotate(18deg)}}

/* Estilos artísticos del avatar */
.avt{display:inline-grid;place-items:center;flex:0 0 auto;border-radius:50%;border:2px solid #ffffff88;box-shadow:0 3px 10px #0004;position:relative}
.avt.style-pixel{border-radius:5px;image-rendering:pixelated;box-shadow:3px 3px 0 #0007,inset 0 0 0 2px #ffffff55;filter:saturate(1.25);font-family:monospace}
.avt.style-paint{border-radius:42% 58% 62% 38%/45% 38% 62% 55%;border:3px dashed #fff9;box-shadow:0 0 0 3px #0002,2px 4px 8px #0005;filter:saturate(1.45) contrast(1.08)}
.avt.style-neon{border:2px solid #fff;box-shadow:0 0 7px #fff,0 0 15px currentColor,inset 0 0 12px #fff8}
.avt.style-sketch{border:2px dashed #fff;filter:grayscale(.3) contrast(1.3);box-shadow:3px 3px 0 #0005}
.avt.style-glass{border:1px solid #ffffffbb;background-image:linear-gradient(135deg,#ffffff88,#ffffff08 55%,#0003)!important;backdrop-filter:blur(3px);box-shadow:inset 0 0 12px #fff8,0 4px 12px #0004}
.avt.style-sticker{border:4px solid #fff;box-shadow:0 3px 0 #0004,0 0 0 2px #2225;transform:rotate(-4deg)}
.avt.style-orbit{border:2px solid #d7faff;box-shadow:0 0 0 4px #ffffff22,0 0 0 7px #ffffff44,0 0 16px #8df}
.avt.style-retro{border-radius:8px;border:3px double #ffe29a;box-shadow:inset 0 0 0 3px #0003,3px 3px 0 #0006;font-family:Georgia,serif}
.ph{display:flex;align-items:center;gap:14px;padding:17px;border-radius:14px;background-size:cover!important;background-position:center!important;isolation:isolate}
.ph.style-pixel .profile-copy{font-family:monospace;text-shadow:2px 2px #000}
.ph.style-paint{border-radius:22px 5px 22px 5px}
.ph.style-paint .pn{font-family:Georgia,serif;font-style:italic;letter-spacing:.04em}
.ph.style-retro .pn{font-family:Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
.ph.style-sketch{border-style:dashed;border-width:3px}
.ph.style-neon{box-shadow:0 0 18px #7df8,inset 0 0 18px #fff2}
.ph.style-glass{backdrop-filter:blur(2px);border-color:#ffffff99;box-shadow:inset 0 0 22px #fff3}
/* Cada estilo tipográfico se aplica al texto completo de la tarjeta de perfil */
.ph.style-clasico .profile-copy,.style-choice .sample.font-clasico{font-family:system-ui,"Segoe UI",sans-serif}
.ph.style-pixel .profile-copy,.style-choice .sample.font-pixel{font-family:"Courier New",monospace;letter-spacing:.035em}
.ph.style-paint .profile-copy,.style-choice .sample.font-paint{font-family:"Brush Script MT","Segoe Script",cursive;font-style:italic}
.ph.style-neon .profile-copy,.style-choice .sample.font-neon{font-family:"Arial",sans-serif;font-weight:900;letter-spacing:.09em;text-shadow:0 0 7px currentColor}
.ph.style-sketch .profile-copy,.style-choice .sample.font-sketch{font-family:"Comic Sans MS","Segoe Print",cursive;font-style:italic}
.ph.style-glass .profile-copy,.style-choice .sample.font-glass{font-family:"Avenir Next","Trebuchet MS",sans-serif;font-weight:300;letter-spacing:.025em}
.ph.style-sticker .profile-copy,.style-choice .sample.font-sticker{font-family:"Trebuchet MS","Arial Rounded MT Bold",sans-serif;font-weight:900;letter-spacing:-.025em}
.ph.style-orbit .profile-copy,.style-choice .sample.font-orbit{font-family:"Century Gothic","Avenir Next",sans-serif;letter-spacing:.12em;font-weight:700}
.ph.style-retro .profile-copy,.style-choice .sample.font-retro{font-family:Georgia,"Times New Roman",serif;letter-spacing:.055em}
.ph .profile-copy .pn,.ph .profile-copy .pt,.ph .profile-copy .pb,.ph .profile-copy .featured{font-family:inherit}
.ph.style-paint .profile-copy .pn,.ph.style-sketch .profile-copy .pn{font-size:1.18em}
.ph.style-neon .profile-copy .pn{letter-spacing:.11em;text-transform:uppercase}
.ph.style-retro .profile-copy .pn{letter-spacing:.08em;text-transform:uppercase}
.style-choice .sample{font-size:18px;font-weight:800;line-height:1}
.style-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0}
.style-choice{min-height:78px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:.78rem}
.style-choice .sample{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fc00ff,#00dbde);font-size:20px}
.style-choice.sel{outline:2px solid var(--acc);border-color:var(--acc)}
.banner-choice{min-height:78px;position:relative;overflow:hidden;border:2px solid #ffffff88;border-radius:10px;color:white;text-shadow:0 1px 3px #000;padding:0}
.banner-choice .banner-art{position:absolute;inset:0}
.banner-choice span{position:relative;z-index:1}

.profile-bg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.profile-bg-choice{display:flex;flex-direction:column;gap:7px;align-items:stretch;text-align:left;padding:8px;border:1px solid var(--line);border-radius:12px;min-width:0}
.profile-bg-choice.sel{border:2px solid var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 20%,transparent)}
.profile-bg-thumb{display:block;width:100%;height:64px;border-radius:8px;border:1px solid #ffffff22;background-size:cover;background-position:center}
.profile-bg-choice b{font-size:.82rem}
@media(max-width:360px){.profile-bg-grid{grid-template-columns:1fr}}
.cosmetic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px;margin:7px 0 14px}
.cosmetic{min-height:48px;padding:8px;font-size:.82rem;line-height:1.25;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cosmetic.sel{outline:2px solid var(--acc);outline-offset:1px}
.cosmetic small{display:block;font-size:.68rem;line-height:1.25;color:inherit;opacity:.82}

async function prepararPerfil(u){
  const ref = doc(db,"users",u.uid);
  try {
    const actual = await getDoc(ref), d = actual.exists() ? actual.data() : {};
    if (d.codigo) return;
    // La transacción evita que dos sesiones creen códigos distintos para la misma cuenta
    // y comprueba que el código no esté ocupado antes de reservarlo.
    for (let intento = 0; intento < 8; intento++){
      const codigo = cod(6), codigoRef = doc(db,"codigos",codigo);
      try {
        await runTransaction(db, async tx => {
          const [perfil, ocupado] = await Promise.all([tx.get(ref), tx.get(codigoRef)]);
          if (perfil.exists() && perfil.data().codigo) return;
          if (ocupado.exists()) throw new Error("Código ocupado");
          tx.set(codigoRef, {uid:u.uid, nombre:nombreDe(u)});
          tx.set(ref, {nombre:d.nombre || nombreDe(u), codigo, victorias:d.victorias || 0, derrotas:d.derrotas || 0, empates:d.empates || 0, creado:d.creado || serverTimestamp()}, {merge:true});
        });
        return;
      } catch (e){ if (e.message !== "Código ocupado" || intento === 7) throw e; }
    }
  } catch (e){ console.error("No se pudo preparar el perfil:", e); }
}

const tocaEsquinaCompartida = (cs,m,b) => { if (!cs || cs.length !== 2) return false; const [a,z] = cs; let pts=[]; if (a.y === z.y && Math.abs(a.x-z.x) === 1){ const x=Math.max(a.x,z.x); pts=[{x,y:a.y},{x,y:a.y+1}]; } else if (a.x === z.x && Math.abs(a.y-z.y) === 1){ const y=Math.max(a.y,z.y); pts=[{x:a.x,y},{x:a.x+1,y}]; } return pts.some(p => Math.abs(p.y-(m*p.x+b)) < 1e-8); };

async function alCambiar(id, g){
  g.lineas = g.lineas || []; g.listo = g.listo || {}; g.pts = g.pts || {1:0,2:0};
  if (id !== gid){
    escucharReacs(id);
    gid = id; mis = []; gast = new Set(); guardado = false; publicado = false; msgP = ""; huella = ""; G = g; yo = g.j1 === U.uid ? 1 : 2;
    try { const s = await getDoc(doc(db,"games",id,"privado",U.uid)); if (s.exists()){ mis = s.data().ships; gast = new Set(s.data().gast); } } catch {}
  }
  G = g; yo = g.j1 === U.uid ? 1 : 2;
  if (!g.j2){ esperaron.add(id); huella = ""; return pintarSala(id, g); }
  // transición con los nombres: al formarse la partida y al empezar la batalla
  if (g.estado === "colocando" && !introVS.has(id) && (esperaron.has(id) || Date.now() - (g.inicio || 0) < 20000)){ introVS.add(id); mostrarIntro(g.n1, g.n2, "Preparen sus flotas"); }
  if (g.estado === "batalla" && estPrev[id] === "colocando") mostrarIntro(g.n1, g.n2, "¡Comienza la batalla!");
  estPrev[id] = g.estado;
  // los amigos ven que estás en partida (para poder espectarla)
  if (g.estado !== "fin" && P.partidaActual !== id) updateDoc(doc(db,"users",U.uid), {partidaActual:id}).catch(() => {});
  if (g.estado === "fin" && P.partidaActual === id) updateDoc(doc(db,"users",U.uid), {partidaActual:null}).catch(() => {});
  const pausaActiva = g.pausa && (g.pausa.estado === "pausada" || g.pausa.estado === "reanudar");
  if (g.ataque && g.ataque.p !== yo && !resolviendo && !pausaActiva) resolver();
  if (g.estado === "fin"){
    const f = g.finales || {};
    if (!f[U.uid] && !publicado){ publicado = true; updateDoc(doc(db,"games",gid), {[`finales.${U.uid}`]:{ships:mis, gast:[...gast]}}).catch(() => {}); }
    if (g.cancelada) guardado = true;
    if (!guardado && f[U.uid] && (f[yo === 1 ? g.j2 : g.j1] || g.abandonoPor)){ guardado = true; guardarFin(); }
  }
  const h = JSON.stringify([g.estado, g.turno, g.ronda, g.lineas.length, !!g.ataque, g.listo, g.pts, g.pausa || null]);
  if (h !== huella){ huella = h; pintarPartida(); }
  else if (g.apunta && g.apunta.p !== yo && $("def")) $("def").innerHTML = radarH("def");
}

function avanzar(g, pts){

async function resolver(){          // lo hace el defensor: solo él conoce sus barcos

      if (s.hund) continue;   // un barco ya derribado cuenta como agua

      libres.sort((u,v) => Math.hypot(u.x+.5, u.y+.5-a.b) - Math.hypot(v.x+.5, v.y+.5-a.b));   // el más cercano a (0, b)

async function pasar(){             // se acabó el tiempo: se pierde el ataque

  try { await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
    if (g.estado !== "batalla" || g.pausa && ["pausada","reanudar"].includes(g.pausa.estado) || g.ataque || Date.now() < g.tiempoFin) return;
    const f = {...(g.fallos || {1:0,2:0})}; f[g.turno] = (f[g.turno] || 0) + 1;

    if (g.estado !== "colocando" || g.pausa && ["pausada","reanudar"].includes(g.pausa.estado) || !g.inicio || Date.now() - g.inicio <= COLOCAR_MS) return;
    const l = g.listo || {}, a = !!l[g.j1], b = !!l[g.j2];
    if (a === b) tx.update(ref, {estado:"fin", cancelada:true, ganador:0});                    // nadie terminó: se cancela
    else tx.update(ref, {estado:"fin", ganador:a ? 1 : 2, abandonoPor:a ? 2 : 1});            // gana quien sí terminó
  }); } catch {}
  pasando = false;
}
async function abandonar(){

  try { await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
    if (g.estado === "fin") return;
    tx.update(ref, {estado:"fin", ganador:3 - yo, abandonoPor:yo, ataque:null, apunta:null, [`finales.${U.uid}`]:{ships:mis, gast:[...gast]}});
  }); publicado = true; } catch {}
}
setInterval(() => {
  if (!G || !G.j2) return;
  const e = $("tm");
  if (G.pausa && ["pausada","reanudar"].includes(G.pausa.estado)) return;
  if (G.estado === "colocando" && G.inicio){
    const r = Math.ceil((G.inicio + COLOCAR_MS - Date.now()) / 1000);
    if (e) e.textContent = fmtT(r);
    if (r <= 0) cancelarColocacion();
    return;
  }
  if (G.estado !== "batalla") return;
  const r = Math.ceil((G.tiempoFin - Date.now()) / 1000);
  if (e) e.textContent = fmtT(r);
  if (!G.ataque && ((G.turno === yo && r <= 0) || r <= -4)) pasar();
}, 1000);

async function solicitarPausa(){
  await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), s = await tx.get(ref);
    if (!s.exists()) throw new Error("La partida ya no existe.");
    const g = s.data();
    if (!g.jugadores || !g.jugadores.includes(U.uid) || !g.j2) throw new Error("No puedes pausar esta partida.");
    if (!["colocando","batalla"].includes(g.estado) || g.pausa) return;
    tx.update(ref, {pausa:{estado:"solicitada", solicitadaPor:U.uid, confirmaciones:{[U.uid]:true}, creada:Date.now()}});
  });
}
async function confirmarPausa(){
  await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), s = await tx.get(ref);
    if (!s.exists()) throw new Error("La partida ya no existe.");
    const g = s.data(), pa = g.pausa || {};
    if (!["colocando","batalla"].includes(g.estado) || pa.estado !== "solicitada" || pa.solicitadaPor === U.uid) return;
    const ahora = Date.now(), restante = g.estado === "batalla"
      ? Math.max(0, (g.tiempoFin || ahora) - ahora)
      : Math.max(0, (g.inicio || ahora) + COLOCAR_MS - ahora);
    tx.update(ref, {pausa:{estado:"pausada", solicitadaPor:pa.solicitadaPor,
      confirmaciones:{...(pa.confirmaciones || {}), [U.uid]:true}, restante,
      tipo:g.estado, pausadaEn:ahora}});
  });
}
async function cancelarPausa(){
  await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), s = await tx.get(ref);
    if (!s.exists()) return;
    const g = s.data();
    if (!g.pausa || g.pausa.estado !== "solicitada" || !g.jugadores.includes(U.uid)) return;
    tx.update(ref, {pausa:null});
  });
}
async function reanudarPartida(){
  await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), s = await tx.get(ref);
    if (!s.exists()) throw new Error("La partida ya no existe.");
    const g = s.data(), pa = g.pausa || {};
    if (!["pausada","reanudar"].includes(pa.estado)) return;
    const confirmaciones = {...(pa.confirmacionesReanudar || {}), [U.uid]:true};
    if (!confirmaciones[g.j1] || !confirmaciones[g.j2]){
      tx.update(ref, {pausa:{...pa, estado:"reanudar", confirmacionesReanudar:confirmaciones}});
      return;
    }
    const restante = Math.max(0, Number(pa.restante) || 0), ahora = Date.now(), patch = {pausa:null};
    if (pa.tipo === "batalla") patch.tiempoFin = ahora + restante;
    if (pa.tipo === "colocando") patch.inicio = ahora + restante - COLOCAR_MS;
    tx.update(ref, {...patch});
  });
}

async function guardarFin(){
  const g = G, f = g.finales, mio = f[U.uid], rv = f[yo === 1 ? g.j2 : g.j1] || {ships:[], gast:[]};
  const res = g.ganador === 0 ? "empate" : g.ganador === yo ? "victoria" : "derrota", ref = doc(db,"users",U.uid,"historial",gid);
  const flota = F => F.ships.map(s => ({c:CL[s.i].c, celdas:s.celdas, hund:!!s.hund})), sol = l => ({m:l.m, b:l.b, rojo:l.rojo});
  try {
    const registro = {resultado:res, rivalNombre:yo === 1 ? g.n2 : g.n1, miPuntaje:g.pts[yo], puntajeRival:g.pts[3-yo],
      mios:g.lineas.filter(l => l.p === yo).map(sol), rival:g.lineas.filter(l => l.p !== yo).map(sol),
      ataques:g.lineas.map(l => ({...l, hits:(l.hits||[]).map(h=>({...h}))})), nombreJ1:g.n1, nombreJ2:g.n2, puntajeJ1:g.pts[1], puntajeJ2:g.pts[2],
      barcos:flota(mio), gast:mio.gast, barcosRival:flota(rv), gastRival:rv.gast, abandono:!!g.abandonoPor, fecha:serverTimestamp()};
    const perfilRef = doc(db,"users",U.uid), campo = {victoria:"victorias", derrota:"derrotas", empate:"empates"}[res];
    // Historial y estadísticas se escriben juntos: evita contar dos veces
    // una partida si llegan varias actualizaciones o se recarga la página.
    await runTransaction(db, async tx => {
      const [anterior, perfil] = await Promise.all([tx.get(ref), tx.get(perfilRef)]);
      if (anterior.exists()) return;
      const datos = perfil.data() || {};
      tx.set(ref, registro);
      tx.set(perfilRef, { [campo]: (datos[campo] || 0) + 1, puntos:(datos.puntos || 0) + g.pts[yo], mejor:Math.max(datos.mejor || 0, g.pts[yo]) }, {merge:true});
    });
  } catch (e){ console.error(e); }
}

function radarEsp(g, p){                 // solo rectas: los barcos nunca se muestran
  let c = "";
  for (let x = -NN; x < NN; x++) for (let y = -NN; y < NN; y++) c += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PERM[3-p].includes(quad(x,y)) ? "var(--card)" : "var(--off)"}" stroke="var(--line)" stroke-width=".03"/>`;
  c += `<path d="M-15 0H15M0 -15V15" stroke="var(--ink)" stroke-width=".07"/>`;
  for (const l of g.lineas.filter(l => l.p === p)) c += ln(Number(l.m), Number(l.b), l.rojo ? "var(--err)" : "var(--azul)", .1, "");
  return `<svg viewBox="-15.6 -15.6 31.2 31.2" style="display:block;width:100%;border:1px solid var(--line);border-radius:6px"><g transform="scale(1,-1)">${c}</g></svg>`;
}
function pintarEsp(){
  const g = E; if (!g) return;
  g.lineas = g.lineas || []; g.pts = g.pts || {1:0,2:0};
  const nm = p => p === 1 ? g.n1 : g.n2, ult = g.lineas[g.lineas.length - 1];

    ${g.estado === "fin" ? `<p class="msg">${g.ganador === 0 ? "Empate" : "Ganó " + esc(nm(g.ganador))}</p>` : ""}
    ${ult ? `<div class="card"><b>${esc(txt(ult))}</b></div>` : `<p class="mut">Aún no hay ataques.</p>`}
    <div class="reacs" id="reacs"></div>
    <div class="row">${EMOJIS.map(e => `<button class="sec emo" data-emoji="${e}" aria-label="Reaccionar ${e}">${e}</button>`).join("")}</div>
    <h2>Ataques de ${esc(g.n1)}</h2>${radarEsp(g, 1)}

}

function estad(d){ const s = {victorias:d.victorias || 0, derrotas:d.derrotas || 0, empates:d.empates || 0, puntos:d.puntos || 0, mejor:d.mejor || 0}; return [s, s.victorias + s.derrotas + s.empates]; }

  return `<span class="avt style-${estilo} mini-frame-${marco} mini-effect-${efecto}" style="width:${px}px;height:${px}px;font-size:${Math.round(px * .55)}px;background:${colorAv(d)}">${e}</span>`;

  else if (a.estado === "aceptada") c = `<span class="tag">✓ ${nom} ya está en tus amistades</span>`;
  else if (a.pedidoPor === U.uid) c = `<span class="tag">Solicitud enviada</span> <button class="mini sec" data-del="${esc(a.id)}">Cancelar</button>`;
  else c = `<b>${nom}</b> te envió una solicitud. <button class="mini" data-acep="${esc(a.id)}">Aceptar</button> <button class="mini sec" data-del="${esc(a.id)}">Rechazar</button>`;
  return `<div class="card" style="margin-top:10px">${c}<p class="err" id="eAm" style="margin:0;min-height:0"></p></div>`;
}
async function agregarAmigo(uid){
  const nom = verDoc?.nombre || "Jugador", ref = doc(db,"amistades",[U.uid, uid].sort().join("_"));
  try {
    await runTransaction(db, async tx => {
      if ((await tx.get(ref)).exists()) return;
      tx.set(ref, {miembros:[U.uid, uid], nombres:{[U.uid]:nombre(), [uid]:nom}, pedidoPor:U.uid, estado:"pendiente", creada:serverTimestamp()});
    });
  } catch { const e = $("eAm"); if (e) e.textContent = "No se pudo enviar la solicitud. Inténtalo de nuevo."; }
}
function pintarUsuario(){
  if (verCargando) return;
  const d = verDoc, volver = `<button class="sec" data-go="${esc(vistaPrev)}">← Volver</button>`;
  if (!d){ $("v-usuario").innerHTML = volver + `<p class="mut" style="margin-top:12px">Este jugador todavía no tiene perfil público. Aparecerá cuando abra la versión nueva del juego.</p>`; return; }
  const [s, j] = estad(d), wr = j ? Math.round(s.victorias / j * 100) : 0;
  const marcoPub = Object.hasOwn(MARCOS,d.marco) && desbloqueado(MARCOS[d.marco],d) ? d.marco : "ninguno";
  const efectoPub = Object.hasOwn(EFECTOS,d.efecto) && desbloqueado(EFECTOS[d.efecto],d) ? d.efecto : "ninguno";
  $("v-usuario").innerHTML = volver + `<div class="profile-decor-shell frame-${marcoPub} effect-${efectoPub}"><div class="profile-bg-layer" style="${fondoPerfilStyle(d)}"></div><div class="profile-decor-layer"></div><div style="margin-top:10px">${cabeceraPerfil(d)}</div>${bloqueAmistad()}
    <div class="card"><div class="stats" style="row-gap:14px"><div><b>${j}</b><span>Jugadas</span></div><div><b>${s.victorias}</b><span>Victorias</span></div><div><b>${s.derrotas}</b><span>Derrotas</span></div>
      <div><b>${s.empates}</b><span>Empates</span></div><div><b>${wr}%</b><span>Win rate</span></div><div><b>${s.mejor}</b><span>Mejor puntaje</span></div></div></div>` + logrosHTML(d) + historialOtro(d) + `</div>`;
}

/* ================= INVITACIONES A PARTIDA ================= */
let invRec = [], invEnv = [], invMsg = "";
const INV_MS = 60000, INV_TXT = {pendiente:"esperando respuesta…", aceptada:"aceptó", rechazada:"rechazó la invitación", cancelada:"invitación cancelada", vencida:"invitación vencida"};
let invKey = "";
function pintarInv(){
  const e = $("invBar"); if (!e) return;
  const v = invRec.filter(i => i.estado === "pendiente" && Date.now() - Number(i.t || 0) < INV_MS), key = v.map(i => i.id).join(",") + "|" + invMsg;
  if (key !== invKey){   // solo se vuelve a dibujar si cambia algo; así los botones no se mueven mientras los tocas
    invKey = key;
    e.innerHTML = v.map(i => `<div class="card glass" style="max-width:480px;margin:10px auto;border-color:var(--acc)"><b>${esc(i.deNombre)}</b> te invita a una partida.<div class="row" style="margin-top:8px"><button class="mini" data-invacep="${esc(i.id)}">Aceptar</button><button class="mini sec" data-invrech="${esc(i.id)}">Rechazar</button><small data-exp="${Number(i.t || 0)}"></small></div></div>`).join("")
      + (invMsg ? `<p class="err" style="max-width:480px;margin:6px auto;padding:0 16px">${esc(invMsg)}</p>` : "");
  }
  e.querySelectorAll("[data-exp]").forEach(x => { x.textContent = "Expira en " + Math.max(0, Math.ceil((INV_MS - (Date.now() - Number(x.dataset.exp))) / 1000)) + " s"; });
}
let ultInv = "";
setInterval(() => { pintarInv(); if (vista === "sala" && G && !G.j2 && gid){ const t = invitesSala(gid); if (t !== ultInv){ ultInv = t; pintarSala(gid, G); } } }, 1000);
function avisoInv(t){ invMsg = t; pintarInv(); setTimeout(() => { invMsg = ""; pintarInv(); }, 6000); }
function invitesSala(id){
  return invEnv.filter(i => i.partida === id).map(i => { const vencida = i.estado === "pendiente" && Date.now() - Number(i.t || 0) >= INV_MS; return `<p>Invitaste a <b>${esc(i.paraNombre)}</b>: ${vencida ? "invitación vencida" : (INV_TXT[i.estado] || esc(i.estado))} ${i.estado === "pendiente" && !vencida ? `<button class="mini sec" data-invcan="${esc(i.id)}">Cancelar</button>` : ""}</p>`; }).join("");
}
async function crearPartidaId(){
  for (let n = 0; n < 8; n++){
    const c = cod(5), ref = doc(db,"games",c);
    const ok = await runTransaction(db, async tx => {
      if ((await tx.get(ref)).exists()) return false;
      tx.set(ref, {j1:U.uid, n1:nombre(), j2:null, n2:null, jugadores:[U.uid], estado:"esperando", lineas:[], listo:{}, pts:{1:0,2:0}, creada:serverTimestamp()});
      return true;
    });
    if (ok) return c;
  }
  throw new Error("No se pudo generar un código.");
}
async function invitar(uidAmigo, nom){
  const id = await crearPartidaId();
  await setDoc(doc(db,"invitaciones", id + "_" + uidAmigo), {de:U.uid, deNombre:nombre(), para:uidAmigo, paraNombre:nom || "Amigo", partida:id, estado:"pendiente", t:Date.now()});
  abrirSala(id);
}
async function aceptarInv(id){
  const inv = invRec.find(i => i.id === id); if (!inv) return;
  if (inv.estado !== "pendiente" || Date.now() - Number(inv.t || 0) >= INV_MS){ avisoInv("Esta invitación ya venció. Pide que te envíen otra."); pintarInv(); return; }
  try {
    const invRef = doc(db,"invitaciones",id), ref = doc(db,"games",inv.partida);
    await runTransaction(db, async tx => {
      const [si, s] = await Promise.all([tx.get(invRef), tx.get(ref)]);
      const actualInv = si.exists() ? si.data() : null, g = s.exists() ? s.data() : null;
      if (!actualInv || actualInv.estado !== "pendiente" || Date.now() - Number(actualInv.t || 0) >= INV_MS) throw {code:"invitacion-vencida"};
      if (!g || g.j2 || g.estado !== "esperando") throw {code:"no-disponible"};
      tx.update(ref, {j2:U.uid, n2:nombre(), estado:"colocando", jugadores:arrayUnion(U.uid), lineas:[], listo:{}, pts:{1:0,2:0}, turno:1, ronda:1, fallos:{1:0,2:0}, inicio:Date.now()});
      tx.update(invRef, {estado:"aceptada"});
    });
    abrirSala(inv.partida);
  } catch (e){
    await updateDoc(doc(db,"invitaciones",id), {estado:"cancelada"}).catch(() => {});
    avisoInv(e.code === "invitacion-vencida" ? "Esta invitación ya venció. Pide que te envíen otra." : "Esa partida ya no está disponible.");
  }
}

function pintarSala(id, g){
  $("v-sala").innerHTML = `<div class="card"><h2 style="margin-top:0">Sala de espera</h2><small>Código de la partida</small><div class="code">${esc(id)}</div>
    <p>Jugador 1: ${esc(g.n1)}<br>Jugador 2: ${esc(g.n2 || "esperando rival…")}</p>
    <p><b>${g.j2 ? "¡Los dos jugadores están dentro! El siguiente paso es colocar los barcos." : "Comparte el código con tu rival."}</b></p>${g.j2 ? "" : invitesSala(id)}</div>
    <button class="sec" data-go="partidas">Volver a mis partidas</button>`;
}
function abrirSala(id){
  if (salaSub){ salaSub(); salaSub = null; }
  ir("sala");
  gid = null; salaSub = onSnapshot(doc(db,"games",id), s => { if (s.exists()) alCambiar(id, s.data()); });
}

function cerrarPreviewCosmetico(){ const m=$("previewCosmetic"); if(m) m.hidden=true; const b=$("previewCosmeticBody"); if(b) b.innerHTML=""; }
function previsualizarCosmetico(tipo, clave){
  const actual=perfilMio(), demo={...actual};
  if(tipo==="marco" && Object.hasOwn(MARCOS,clave)) demo.marco=clave;
  else if(tipo==="efecto" && Object.hasOwn(EFECTOS,clave)) demo.efecto=clave;
  else return;
  const item=tipo==="marco"?MARCOS[clave]:EFECTOS[clave];
  const req=[item.victorias?item.victorias+" victorias":null,item.mejor?item.mejor+" puntos en una partida":null,item.puntos?item.puntos+" puntos acumulados":null,item.req?item.req+" partidas":null].filter(Boolean).join(" · ") || "Sin requisito adicional";
  const shell=`<div class="profile-decor-shell frame-${demo.marco||"ninguno"} effect-${demo.efecto||"ninguno"}"><div class="profile-bg-layer" style="${fondoPerfilStyle(demo)}"></div><div class="profile-decor-layer"></div>${cabeceraPerfil(demo,true)}<div class="card"><b>Estadísticas</b><div class="stats"><div><b>${Number(demo.victorias)||0}</b><span>Victorias</span></div><div><b>${Number(demo.derrotas)||0}</b><span>Derrotas</span></div><div><b>${Number(demo.empates)||0}</b><span>Empates</span></div></div></div><div class="card"><b>Insignias y logros</b><p class="mut">La decoración también se aplica a esta sección.</p>🏆 🎖️ 💎 ⭐</div><div class="card"><b>Historial de partidas</b><p class="mut">Así se verá el resto del perfil.</p><div class="item">Victoria · 250 pts</div><div class="item">Derrota · 120 pts</div></div></div>`;
  $("previewCosmeticBody").innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div><b>Vista previa: ${esc(item.n)}</b><div class="mut">Requisito: ${esc(req)}</div></div><button class="mini sec" data-close-preview>✕</button></div><div class="preview-sample">${shell}</div><p class="mut">Vista previa solamente: no desbloquea ni equipa el elemento.</p><div class="preview-actions"><button class="sec" data-close-preview>Cerrar</button></div>`;
  $("previewCosmetic").hidden=false;
}

/* ---------- Acciones (delegación de eventos) ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t || !U) return;
  const d = t.dataset;
  try {
    if (d.liveReport !== undefined) return abrirInformeAtaques(G?.lineas || [], G?.n1 || "Jugador 1", G?.n2 || "Jugador 2", G?.pts?.[1] || 0, G?.pts?.[2] || 0);
    if (d.report){ let lineas=[]; try { lineas=JSON.parse(decodeURIComponent(d.report)); } catch {} return abrirInformeAtaques(lineas, d.n1, d.n2, d.p1, d.p2); }
    if (d.closePreview !== undefined){ cerrarPreviewCosmetico(); return; }
    if (d.previewType && d.previewKey){ previsualizarCosmetico(d.previewType,d.previewKey); return; }
    if (d.go) return ir(d.go);
    if (d.sala) return abrirSala(d.sala);
    if (d.espectar) return espectar(d.espectar);
    if (d.emoji) return enviarEmoji(d.emoji);
    if (d.perfil) return verPerfil(d.perfil);
    if (d.pers){ persAbierto = !persAbierto; return pintarPerfil(); }
    if (d.perstab){ persTab=d.perstab; return pintarPerfil(); }
    if (t.id === "bFondoCustom"){
      const a=$("fondoColorA")?.value, b=$("fondoColorB")?.value;
      if(hexValido(a)&&hexValido(b)) return await updateDoc(doc(db,"users",U.uid), {fondo:`custom:${a}:${b}`});
    }
    if (d.agregar) return await agregarAmigo(d.agregar);
    if (d.ins !== undefined){ const e = t.closest(".card")?.querySelector(".insTxt"); if (e) e.textContent = d.ins; return; }
    if (d.invitar) return await invitar(d.invitar, d.nombre);
    if (d.invacep) return await aceptarInv(d.invacep);
    if (d.invrech) return await updateDoc(doc(db,"invitaciones",d.invrech), {estado:"rechazada"});
    if (d.invcan) return await updateDoc(doc(db,"invitaciones",d.invcan), {estado:"cancelada"});
    if (d.estilo && Object.hasOwn(ESTILOS_AVATAR,d.estilo)) return await updateDoc(doc(db,"users",U.uid), {estiloAvatar:d.estilo});
    if (d.av) return await updateDoc(doc(db,"users",U.uid), {avatar:d.av === "-" ? "" : d.av});
    if (d.avc) return await updateDoc(doc(db,"users",U.uid), {avatarColor:d.avc});
    if (d.fondo) return await updateDoc(doc(db,"users",U.uid), {fondo:d.fondo});
    if (d.fondoPerfil && Object.hasOwn(FONDOS_PERFIL,d.fondoPerfil)) return await updateDoc(doc(db,"users",U.uid), {fondoPerfil:d.fondoPerfil});
    if (d.marco && Object.hasOwn(MARCOS,d.marco) && desbloqueado(MARCOS[d.marco],perfilMio())) return await updateDoc(doc(db,"users",U.uid), {marco:d.marco});
    if (d.efecto && Object.hasOwn(EFECTOS,d.efecto) && desbloqueado(EFECTOS[d.efecto],perfilMio())) return await updateDoc(doc(db,"users",U.uid), {efecto:d.efecto});
    if (t.id === "bBio") return await updateDoc(doc(db,"users",U.uid), {bio:$("pBio").value.trim().slice(0, 80)});
    if (d.rk){ if (d.rk === "actualizar") return cargarRanking(); rkTab = d.rk; return pintarRanking(); }
    if (d.histPage){ paginaHistorial = Math.max(0, paginaHistorial + Number(d.histPage)); return pintarPerfil(); }
    if (t.id === "bCrear"){
      let id = "", creada = false;
      // Se reserva el identificador de forma atómica para no sobrescribir otra sala.
      for (let intento = 0; intento < 8 && !creada; intento++){
        const candidato = cod(5), ref = doc(db,"games",candidato);
        creada = await runTransaction(db, async tx => {
          const existente = await tx.get(ref);
          if (existente.exists()) return false;
          tx.set(ref, {j1:U.uid, n1:nombre(), j2:null, n2:null, jugadores:[U.uid], estado:"esperando", lineas:[], listo:{}, pts:{1:0,2:0}, creada:serverTimestamp()});
          return true;
        });
        if (creada) id = candidato;
      }
      if (!creada) throw new Error("No se pudo generar un código. Inténtalo de nuevo.");
      return abrirSala(id);
    }
    if (t.id === "bUnir"){
      const id = $("codigo").value.trim().toUpperCase(), er = $("eInicio");
      if (!/^[A-HJ-NP-Z2-9]{5}$/.test(id)){ er.textContent = "El código debe tener 5 caracteres válidos."; return; }
      const ref = doc(db,"games",id);
      const resultado = await runTransaction(db, async tx => {
        const s = await tx.get(ref);
        if (!s.exists()) return "missing";
        const g = s.data();
        if (g.j1 === U.uid || g.j2 === U.uid) return "joined";
        if (g.estado !== "esperando" || g.j2) return "full";
        tx.update(ref, {j2:U.uid, n2:nombre(), estado:"colocando", jugadores:arrayUnion(U.uid), lineas:[], listo:{}, pts:{1:0,2:0}, turno:1, ronda:1, fallos:{1:0,2:0}, inicio:Date.now()});
        return "joined";
      });
      if (resultado === "missing"){ er.textContent = "No existe una partida con ese código."; return; }
      if (resultado === "full"){ er.textContent = "Esa partida ya está llena o ya comenzó."; return; }
      return abrirSala(id);
    }
    if (t.id === "bAmigo"){
      const c = $("cAmigo").value.trim().toUpperCase(); msgAmigo = "";
      if (c.length !== 6) msgAmigo = "El código tiene 6 caracteres.";
      else {
        const s = await getDoc(doc(db,"codigos",c));
        if (!s.exists()) msgAmigo = "No existe ese código.";
        else if (s.data().uid === U.uid) msgAmigo = "Ese código es el tuyo.";
        else {
          const o = s.data(), id = [U.uid, o.uid].sort().join("_"), ref = doc(db,"amistades",id);
          const estado = await runTransaction(db, async tx => {
            const existente = await tx.get(ref);
            if (existente.exists()) return existente.data().estado === "aceptada" ? "friends" : "pending";
            tx.set(ref, {miembros:[U.uid,o.uid], nombres:{[U.uid]:nombre(), [o.uid]:o.nombre || "Jugador"}, pedidoPor:U.uid, estado:"pendiente", creada:serverTimestamp()});
            return "sent";
          });
          msgAmigo = estado === "friends" ? "Ya son amigos." : estado === "pending" ? "Ya existe una solicitud pendiente entre ustedes." : "✓ Solicitud enviada a " + (o.nombre || "tu amigo");
        }
      }
      return pintarAmigos();
    }
    if (d.acep) return await updateDoc(doc(db,"amistades",d.acep), {estado:"aceptada"});
    if (d.del){
      const relacion = amistades.find(a => a.id === d.del);
      if (!relacion) return;
      const amigoNombre = relacion.nombres?.[otro(relacion)] || "este jugador";
      const esAmistad = relacion.estado === "aceptada";
      const pregunta = esAmistad
        ? `¿Seguro que quieres cancelar la amistad con ${amigoNombre}?

Ya no aparecerá en tu lista de amigos.`
        : relacion.pedidoPor === U.uid
          ? `¿Quieres cancelar la solicitud de amistad enviada a ${amigoNombre}?`
          : `¿Quieres rechazar la solicitud de amistad de ${amigoNombre}?`;
      if (!window.confirm(pregunta)) return;
      await deleteDoc(doc(db,"amistades",d.del));
      return;
    }
    if (t.id === "bNombre"){
      const n = $("pNombre").value.trim(); if (n.length < 3){ $("ePerfil").textContent = ERR.nombre; return; }
      await updateProfile(U, {displayName:n});
      await updateDoc(doc(db,"users",U.uid), {nombre:n});
      if (P.codigo) await updateDoc(doc(db,"codigos",P.codigo), {nombre:n});
      $("ePerfil").textContent = ""; return pintar();
    }
    if (t.id === "bCopiar"){ try { await navigator.clipboard.writeText(P.codigo || ""); t.textContent = "¡Copiado!"; } catch { t.textContent = P.codigo || ""; } return; }
    if (t.id === "bEjemplo") return await ejemplo();
    if (t.id === "solicitarPausa") return await solicitarPausa();
    if (t.id === "confirmarPausa") return await confirmarPausa();
    if (t.id === "cancelarPausa") return await cancelarPausa();
    if (t.id === "reanudarPartida") return await reanudarPartida();
    if (t.id === "bSalir") return signOut(auth);
  } catch (er){
    const x = $("eInicio") || $("ePerfil"); if (vista === "amigos"){ msgAmigo = texto(er); pintarAmigos(); } else if (x) x.textContent = texto(er);
  }
});
</script>
