<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalla en el plano</title>
<style>
:root{--bg:#e8eef0;--card:#f6f9fa;--ink:#10303a;--mut:#5d7882;--line:#a9bec5;--acc:#0f6b7a;--on:#fff;--err:#b3261e;--ok:#2e7d32;--off:#d3dfe3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1d22;--card:#14292f;--ink:#dcebef;--mut:#8fa9b1;--line:#2c474f;--acc:#4fb3c6;--on:#06222a;--err:#ff8a80;--ok:#81c784;--off:#0f2227;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font:700 1.15rem Georgia,serif;margin:0}
h2{font:600 1.05rem Georgia,serif;margin:18px 0 8px}
main{max-width:480px;margin:0 auto;padding:14px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.big{display:block;width:100%;padding:16px;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
input{width:100%;padding:11px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{padding:10px 14px;font:inherit;font-weight:600;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:var(--on);cursor:pointer}
button.sec{background:transparent;color:var(--acc)}
button.mini{padding:6px 10px;font-size:.85rem}
button.link{border:0;background:none;color:var(--acc);text-decoration:underline;padding:6px 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:700 1.6rem Georgia,serif}
.stats span,small,.mut{color:var(--mut);font-size:.85rem}
.err{color:var(--err);min-height:1.3em;margin:8px 0 0;font-size:.9rem}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;overflow:hidden;padding:0;border:0}
.av img{width:100%;height:100%;object-fit:cover}
.code{font:700 2rem ui-monospace,Menlo,monospace;letter-spacing:.2em}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:0}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:4px;left:55%;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:.65rem;display:grid;place-items:center;padding:0 4px}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
details.h{border-bottom:1px solid var(--line);padding:8px 0}details.h:last-child{border:0}
.win{color:var(--ok)}.lose{color:var(--err)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}.bar b{color:var(--ink)}
.rad{margin:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Batalla en el plano</h1><button class="av" id="hAv" hidden aria-label="Mi perfil"></button></header>
<main>
<section id="auth" hidden>
  <div class="card">
    <h2 id="tAuth" style="margin-top:0">Iniciar sesión</h2>
    <div id="fNombre" hidden><label for="nombre">Nombre de jugador</label><input id="nombre" maxlength="20"></div>
    <label for="email">Correo</label><input id="email" type="email" autocomplete="email">
    <label for="pass">Contraseña (mínimo 6 caracteres)</label><input id="pass" type="password">
    <p class="err" id="eAuth"></p>
    <div class="row"><button id="bEnviar">Entrar</button><button class="sec" id="bGoogle">Continuar con Google</button></div>
    <button class="link" id="bModo">Crear cuenta nueva</button><br>
    <button class="link" id="bReset">Olvidé mi contraseña</button>
  </div>
</section>

<div id="app" hidden>
  <section id="v-inicio"></section>
  <section id="v-partidas" hidden></section>
  <section id="v-amigos" hidden></section>
  <section id="v-perfil" hidden></section>
  <section id="v-sala" hidden></section>
</div>
</main>
<nav id="nav" hidden>
  <button data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</button>
  <button data-v="partidas"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>Partidas</button>
  <button data-v="amigos"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.500-6s6.500 2 6.500 6M17 5a3.500 3.500 0 010 6.500M21.500 20c0-3-1.500-5-4-5.800"/></svg>Amigos<i class="dot" id="dotA" hidden>0</i></button>
  <button data-v="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.500 3.500-7 8-7s8 2.500 8 7"/></svg>Perfil</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,updateProfile,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,doc,collection,query,where,setDoc,getDoc,updateDoc,deleteDoc,addDoc,increment,runTransaction,onSnapshot,arrayUnion,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyCUnK2WJZurAZXTkZEW_MPzIykH4mMByjU", authDomain:"prueba-2-df121.firebaseapp.com",
  projectId:"prueba-2-df121", storageBucket:"prueba-2-df121.firebasestorage.app",
  messagingSenderId:"147257342708", appId:"1:147257342708:web:81be883437b83c7e443ca1"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ERR = {
  "auth/invalid-credential":"Correo o contraseña incorrectos.","auth/invalid-email":"El correo no es válido.",
  "auth/email-already-in-use":"Ese correo ya tiene una cuenta. Inicia sesión.","auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
  "auth/popup-closed-by-user":"Cerraste la ventana de Google antes de terminar.","auth/too-many-requests":"Demasiados intentos. Espera un momento.",
  "permission-denied":"No se pudo completar. Puede que ya exista esa solicitud o amistad.","nombre":"El nombre debe tener al menos 3 caracteres."
};
const texto = e => e.m || ERR[e.code] || "Algo salió mal. Inténtalo de nuevo.";
const LET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const cod = n => Array.from({length:n}, () => LET[Math.floor(Math.random()*LET.length)]).join("");

let U = null, P = {}, historial = [], amistades = [], partidas = [], subs = [], salaSub = null, vista = "inicio", modo = "entrar", msgAmigo = "";
const nombreDe = u => u.displayName || (u.email || "Jugador").split("@")[0];

/* ---------- Autenticación ---------- */
function pintarModo(){
  const c = modo === "crear";
  $("tAuth").textContent = c ? "Crear cuenta" : "Iniciar sesión";
  $("bEnviar").textContent = c ? "Crear cuenta" : "Entrar";
  $("bModo").textContent = c ? "Ya tengo cuenta" : "Crear cuenta nueva";
  $("fNombre").hidden = !c; $("eAuth").textContent = "";
}
$("bModo").onclick = () => { modo = modo === "crear" ? "entrar" : "crear"; pintarModo(); };
$("bEnviar").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value;
  try {
    if (modo === "crear"){
      const n = $("nombre").value.trim(); if (n.length < 3) throw {code:"nombre"};
      let fin; espera = new Promise(r => fin = r);
      try {
        const c = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(c.user, {displayName:n});
      } finally { fin(); }
    } else await signInWithEmailAndPassword(auth, email, pass);
  } catch (e){ $("eAuth").textContent = texto(e); }
};
$("bGoogle").onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e){ $("eAuth").textContent = texto(e); } };
$("bReset").onclick = async () => {
  const email = $("email").value.trim();
  if (!email){ $("eAuth").textContent = "Escribe tu correo y vuelve a tocar el enlace."; return; }
  try { await sendPasswordResetEmail(auth, email); $("eAuth").textContent = "Te enviamos un correo para restablecerla."; } catch (e){ $("eAuth").textContent = texto(e); }
};

let espera = Promise.resolve();
onAuthStateChanged(auth, async u => {
  await espera; espera = Promise.resolve();
  subs.forEach(f => f()); subs = []; if (salaSub){ salaSub(); salaSub = null; }
  U = u;
  if (!u){ $("auth").hidden = false; $("app").hidden = $("nav").hidden = $("hAv").hidden = true; pintarModo(); return; }
  await prepararPerfil(u);
  $("auth").hidden = true; $("app").hidden = $("nav").hidden = $("hAv").hidden = false;
  subs.push(onSnapshot(doc(db,"users",u.uid), s => { P = s.data() || P; pintar(); }));
  subs.push(onSnapshot(query(collection(db,"amistades"), where("miembros","array-contains",u.uid)), s => { amistades = s.docs.map(d => ({id:d.id, ...d.data()})); pintar(); }));
  subs.push(onSnapshot(query(collection(db,"games"), where("jugadores","array-contains",u.uid)), s => { partidas = s.docs.map(d => ({id:d.id, ...d.data()})); pintar(); }));
  subs.push(onSnapshot(collection(db,"users",u.uid,"historial"), s => { historial = s.docs.map(d => ({id:d.id, ...d.data()})); pintar(); }));
  ir("inicio");
});

async function prepararPerfil(u){
  const ref = doc(db,"users",u.uid);
  try {
    const s = await getDoc(ref); let d = s.exists() ? s.data() : null;
    if (!d || !d.codigo){
      let c = "";
      for (let i = 0; i < 4; i++){
        const t = cod(6);
        try { await setDoc(doc(db,"codigos",t), {uid:u.uid, nombre:nombreDe(u)}); c = t; break; } catch {}
      }
      await setDoc(ref, {nombre:d?.nombre || nombreDe(u), codigo:c, victorias:d?.victorias || 0, derrotas:d?.derrotas || 0, creado:d?.creado || serverTimestamp()}, {merge:true});
    }
  } catch {}
}

/* ---------- Navegación ---------- */
const VISTAS = ["inicio","partidas","amigos","perfil","sala"];
function ir(v){
  vista = v;
  VISTAS.forEach(x => $("v-"+x).hidden = x !== v);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === (v === "sala" ? "partidas" : v)));
  pintar(); window.scrollTo(0,0);
}
$("nav").onclick = e => { const b = e.target.closest("button"); if (b) ir(b.dataset.v); };
$("hAv").onclick = () => ir("perfil");

/* ---------- Pintar vistas ---------- */
const nombre = () => P.nombre || (U && nombreDe(U)) || "Jugador";
const rival = g => g.j1 === U.uid ? g.n2 : g.n1;
const estadoTxt = g => g.j2 ? "Lista" : "Esperando rival";
const pendientes = () => amistades.filter(a => a.estado === "pendiente" && a.pedidoPor !== U.uid);
const otro = a => a.miembros.find(m => m !== U.uid);

function pintar(){
  if (!U) return;
  const av = $("hAv");
  av.innerHTML = U.photoURL ? `<img src="${esc(U.photoURL)}" alt="" referrerpolicy="no-referrer">` : esc(nombre()[0].toUpperCase());
  const n = pendientes().length; $("dotA").hidden = !n; $("dotA").textContent = n;
  if (vista === "inicio") pintarInicio();
  if (vista === "partidas") pintarPartidas();
  if (vista === "amigos") pintarAmigos();
  if (vista === "perfil") pintarPerfil();
}

function pintarInicio(){
  const act = partidas.filter(g => g.estado !== "terminada").length;
  $("v-inicio").innerHTML = `
    <h2 style="margin-top:6px">Hola, ${esc(nombre())}</h2>
    <button class="big" id="bCrear">Crear partida</button>
    <div class="card"><label for="codigo" style="margin-top:0">Unirme con un código</label>
      <div class="row"><input id="codigo" maxlength="5" style="text-transform:uppercase" placeholder="ABCDE"><button id="bUnir">Unirme</button></div>
      <p class="err" id="eInicio"></p></div>
    <div class="card"><div class="stats"><div><b>${P.victorias || 0}</b><span>Victorias</span></div><div><b>${P.derrotas || 0}</b><span>Derrotas</span></div><div><b>${act}</b><span>Activas</span></div></div></div>
    <div class="row"><button class="sec" style="flex:1" data-go="partidas">Mis partidas</button><button class="sec" style="flex:1" data-go="amigos">Amigos</button></div>`;
}

function pintarPartidas(){
  const l = [...partidas].sort((a,b) => (b.creada?.seconds || 0) - (a.creada?.seconds || 0));
  $("v-partidas").innerHTML = `<h2 style="margin-top:6px">Mis partidas</h2><div class="card">` +
    (l.length ? l.map(g => `<div class="item"><div><b>${esc(g.id)}</b> <span class="tag">${estadoTxt(g)}</span><br><small>Rival: ${esc(rival(g) || "esperando…")}</small></div><button class="mini" data-sala="${esc(g.id)}">Abrir</button></div>`).join("")
      : `<p class="mut">Aún no tienes partidas. Crea una desde Inicio.</p>`) + `</div>`;
}

function pintarAmigos(){
  const acept = amistades.filter(a => a.estado === "aceptada");
  const rec = pendientes(), env = amistades.filter(a => a.estado === "pendiente" && a.pedidoPor === U.uid);
  const fila = (a, bot) => `<div class="item"><span>${esc(a.nombres?.[otro(a)] || "Jugador")}</span><span>${bot}</span></div>`;
  $("v-amigos").innerHTML = `<h2 style="margin-top:6px">Amigos</h2>
    <div class="card"><label for="cAmigo" style="margin-top:0">Agregar amigo con su código</label>
      <div class="row"><input id="cAmigo" maxlength="6" style="text-transform:uppercase" placeholder="Código de 6 letras"><button id="bAmigo">Enviar</button></div>
      <p class="${msgAmigo.startsWith("✓") ? "mut" : "err"}">${esc(msgAmigo)}</p></div>
    ${rec.length ? `<h2>Solicitudes</h2><div class="card">${rec.map(a => fila(a, `<button class="mini" data-acep="${a.id}">Aceptar</button> <button class="mini sec" data-del="${a.id}">Rechazar</button>`)).join("")}</div>` : ""}
    <h2>Mis amigos</h2><div class="card">${acept.length ? acept.map(a => fila(a, `<button class="mini sec" data-del="${a.id}">Quitar</button>`)).join("") : `<p class="mut">Todavía no tienes amigos agregados.</p>`}</div>
    ${env.length ? `<h2>Enviadas</h2><div class="card">${env.map(a => fila(a, `<span class="tag">Pendiente</span> <button class="mini sec" data-del="${a.id}">Cancelar</button>`)).join("")}</div>` : ""}`;
}

function pintarPerfil(){
  const v = P.victorias || 0, d = P.derrotas || 0, e = P.empates || 0, j = v + d + e;
  const wr = j ? Math.round(v / j * 100) : 0;
  const lista = [...historial].sort((a,b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));
  const RES = {victoria:["Victoria","win"], derrota:["Derrota","lose"], empate:["Empate",""]};
  $("v-perfil").innerHTML = `<h2 style="margin-top:6px">Mi perfil</h2>
    <div class="card"><label for="pNombre" style="margin-top:0">Nombre de jugador</label>
      <div class="row"><input id="pNombre" maxlength="20" value="${esc(nombre())}"><button id="bNombre">Guardar</button></div>
      <p class="err" id="ePerfil"></p><small>${esc(U.email || "")}</small></div>
    <div class="card"><div class="stats" style="row-gap:14px"><div><b>${j}</b><span>Jugadas</span></div><div><b>${v}</b><span>Victorias</span></div><div><b>${d}</b><span>Derrotas</span></div>
      <div><b>${e}</b><span>Empates</span></div><div><b>${wr}%</b><span>Win rate</span></div><div><b>${P.mejor || 0}</b><span>Mejor puntaje</span></div></div></div>
    <h2>Historial</h2><div class="card">${lista.length ? lista.map(h => { const r = RES[h.resultado] || ["Partida",""]; return `<details class="h"><summary class="item" style="padding:0;border:0"><div style="width:76px;flex:none">${mini(h,"mios")}</div><div style="flex:1"><b class="${r[1]}">${r[0]}</b> vs ${esc(h.rivalNombre)}<br><small>${Number(h.miPuntaje)} – ${Number(h.puntajeRival)} pts · ${fecha(h)}</small></div></summary><div class="two"><div><small>Mis ataques</small>${mini(h,"mios")}</div><div><small>Ataques rivales en mi flota</small>${mini(h,"rival")}</div></div></details>`; }).join("") : `<p class="mut">Aún no hay partidas. Cuando termines una, aparecerá aquí con la vista previa de los ataques.</p>`}
      <button class="mini sec" id="bEjemplo" style="margin-top:10px">Agregar partida de ejemplo (prueba)</button></div>
    <div class="card"><small>Tu código de amigo</small><div class="code" style="font-size:1.6rem">${esc(P.codigo || "…")}</div>
      <button class="mini sec" id="bCopiar" style="margin-top:8px">Copiar código</button></div>
    <button class="sec big" id="bSalir">Cerrar sesión</button>`;
}

const fecha = h => h.fecha?.seconds ? new Date(h.fecha.seconds * 1000).toLocaleDateString("es") : "";
function mini(h, modo){   // vista previa del plano con las rectas de la partida
  let g = "";
  for (let x = -6; x < 6; x++) for (let y = -6; y < 6; y++) g += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--card)" stroke="var(--line)" stroke-width=".03"/>`;
  if (modo === "rival") for (const b of h.barcos || []) for (const c of b.celdas) g += `<rect x="${Number(c.x) + .06}" y="${Number(c.y) + .06}" width=".88" height=".88" rx=".12" fill="${esc(b.c)}"/>`;
  g += `<path d="M-7 0H7M0 -7V7" stroke="var(--ink)" stroke-width=".07"/>`;
  for (const l of (modo === "mios" ? h.mios : h.rival) || []){
    const m = Number(l.m), b = Number(l.b);
    g += `<line x1="-8" y1="${m * -8 + b}" x2="8" y2="${m * 8 + b}" stroke="${l.rojo ? "var(--err)" : "#e0a800"}" stroke-width=".13" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="-6.2 -6.2 12.4 12.4" style="display:block;width:100%;border:1px solid var(--line);border-radius:6px"><g transform="scale(1,-1)">${g}</g></svg>`;
}
// Se llamará al terminar una partida real; el botón de ejemplo la usa para probar el diseño.
async function guardarPartida(d){
  await addDoc(collection(db,"users",U.uid,"historial"), {...d, fecha:serverTimestamp()});
  const campo = {victoria:"victorias", derrota:"derrotas", empate:"empates"}[d.resultado];
  await updateDoc(doc(db,"users",U.uid), {[campo]:increment(1), puntos:increment(d.miPuntaje), mejor:Math.max(P.mejor || 0, d.miPuntaje)});
}
async function ejemplo(){
  const lin = n => Array.from({length:n}, () => ({m:Math.round((Math.random() * 4 - 2) * 2) / 2, b:Math.round(Math.random() * 8 - 4), rojo:Math.random() < .5}));
  const a = Math.floor(Math.random() * 300), z = Math.floor(Math.random() * 300);
  await guardarPartida({resultado:a > z ? "victoria" : a < z ? "derrota" : "empate", rivalNombre:"Rival de prueba", miPuntaje:a, puntajeRival:z, mios:lin(10), rival:lin(10),
    barcos:[{c:"#3a6ea5", celdas:[0,1,2,3].map(i => ({x:i, y:2}))}, {c:"#4a9a5a", celdas:[{x:-3, y:-2}, {x:-3, y:-1}]}]});
}
/* ================= PARTIDA ONLINE ================= */
const PERM = {1:[1,2,4], 2:[2,3,4]}, RONDAS = 10, SEG = 90, NN = 6;
const CL = [
  {n:"Portaaviones", L:4, pts:100, um:70, d:[20,50,50,20], c:"#3a6ea5", q:2},
  {n:"Acorazado",    L:3, pts:90,  um:65, d:[25,45,25],    c:"#c9772b", q:2},
  {n:"Destructor",   L:2, pts:60,  um:50, d:[30,30],       c:"#4a9a5a", q:3},
  {n:"Submarino",    L:2, pts:30,  um:50, d:[50,50],       c:"#7b5ea7", q:2}
];
const FLOTA = CL.flatMap((c,i) => Array(c.q).fill(i));
const quad = (x,y) => x>=0&&y>=0 ? 1 : x<0&&y>=0 ? 2 : x<0&&y<0 ? 3 : 4;
const kk = c => c.x + "," + c.y;
const cruza = (c,m,b) => { const v = [[0,0],[1,0],[0,1],[1,1]].map(([i,j]) => c.y+j - m*(c.x+i) - b); return Math.min(...v) < -1e-9 && Math.max(...v) > 1e-9; };
const fmtT = r => Math.floor(Math.max(r,0)/60) + ":" + String(Math.max(r,0)%60).padStart(2,"0");
let G = null, gid = null, yo = 0, mis = [], gast = new Set(), drag = null, horiz = true, vm = "1", vb = "0",
    huella = "", resolviendo = false, pasando = false, guardado = false, msgP = "", aimT = null;

async function alCambiar(id, g){
  g.lineas = g.lineas || []; g.listo = g.listo || {}; g.pts = g.pts || {1:0,2:0};
  if (id !== gid){
    gid = id; mis = []; gast = new Set(); guardado = false; msgP = ""; huella = ""; G = g; yo = g.j1 === U.uid ? 1 : 2;
    try { const s = await getDoc(doc(db,"games",id,"privado",U.uid)); if (s.exists()){ mis = s.data().ships; gast = new Set(s.data().gast); } } catch {}
  }
  G = g; yo = g.j1 === U.uid ? 1 : 2;
  if (!g.j2){ huella = ""; return pintarSala(id, g); }
  if (g.ataque && g.ataque.p !== yo && !resolviendo) resolver();
  if (g.estado === "fin" && !guardado){ guardado = true; guardarFin(); }
  const h = JSON.stringify([g.estado, g.turno, g.ronda, g.lineas.length, !!g.ataque, g.listo, g.pts]);
  if (h !== huella){ huella = h; pintarPartida(); }
  else if (g.apunta && g.apunta.p !== yo && $("def")) $("def").innerHTML = radarH("def");
}

/* --- dibujo --- */
const ln = (m,b,c,w,d) => `<line x1="-8" y1="${m*-8+b}" x2="8" y2="${m*8+b}" stroke="${c}" stroke-width="${w}" ${d ? `stroke-dasharray="${d}"` : ""} stroke-linecap="round"/>`;
function radarH(modo, prev, place){
  const p = modo === "def" ? yo : 3 - yo, zona = PERM[p];
  let g = "";
  for (let x=-NN; x<NN; x++) for (let y=-NN; y<NN; y++) g += `<rect x="${x}" y="${y}" width="1" height="1" fill="${zona.includes(quad(x,y)) ? "var(--card)" : "var(--off)"}" stroke="var(--line)" stroke-width=".03"/>`;
  if (modo === "def") for (const s of mis) for (const c of s.celdas){
    g += `<rect x="${c.x+.06}" y="${c.y+.06}" width=".88" height=".88" rx=".12" fill="${CL[s.i].c}" opacity="${s.hund ? .45 : 1}"/>`;
    if (gast.has(kk(c))) g += `<path d="M${c.x+.25} ${c.y+.25}L${c.x+.75} ${c.y+.75}M${c.x+.75} ${c.y+.25}L${c.x+.25} ${c.y+.75}" stroke="#fff" stroke-width=".1"/>`;
  }
  if (prev && prev.celdas) for (const c of prev.celdas) g += `<rect x="${c.x}" y="${c.y}" width="1" height="1" fill="${prev.ok ? "#2e7d32" : "#d23a2a"}" opacity=".55"/>`;
  g += `<path d="M-7 0H7M0 -7V7" stroke="var(--ink)" stroke-width=".07"/>`;
  for (const l of G.lineas.filter(l => modo === "atk" ? l.p === yo : l.p !== yo)) g += ln(l.m, l.b, l.rojo ? "var(--err)" : "#e0a800", .1, "");
  if (modo === "def" && G.apunta && G.apunta.p !== yo) g += ln(G.apunta.m, G.apunta.b, "var(--err)", .06, ".25 .2");
  if (prev && prev.linea) g += ln(prev.linea.m, prev.linea.b, "var(--acc)", .08, ".25 .2");
  let t = "";
  for (let i=-6; i<=6; i+=2) if (i) t += `<text x="${i}" y="-.3" font-size=".5" text-anchor="middle" fill="var(--mut)">${i}</text><text x=".2" y="${-i+.17}" font-size=".5" fill="var(--mut)">${i}</text>`;
  return `<svg viewBox="-6.4 -6.4 12.8 12.8" style="display:block;width:100%;border:1px solid var(--line);border-radius:6px;${place ? "touch-action:none" : ""}"><g transform="scale(1,-1)">${g}</g>${t}</svg>`;
}
const ultTxt = l => `${l.p === yo ? "Tu ataque" : "Ataque rival"} (y = ${l.m}x + ${l.b}): ${l.rojo ? "tocó barcos" : "no tocó ningún barco"}. ` + (l.hits || []).map(h => `${h.n} −${h.d}%${h.h ? " ¡derribado!" : ""}`).join(" | ");
function resumenH(){
  const m = new Map(); for (const l of G.lineas.filter(l => l.p === yo)) for (const h of l.hits || []) m.set(h.k, h);
  const v = [...m.values()], tot = {}, c = {}; v.forEach(h => tot[h.n] = (tot[h.n] || 0) + 1);
  return v.length ? v.map(h => { c[h.n] = (c[h.n] || 0) + 1; return `${h.n}${tot[h.n] > 1 ? " " + c[h.n] : ""}: ${h.h ? "derribado" : h.t + "%"}`; }).join(" · ") : "ninguno todavía";
}
function pintarPartida(){
  const g = G, p = yo, riv = p === 1 ? g.n2 : g.n1, bat = g.estado === "batalla", ult = g.lineas[g.lineas.length - 1];
  let h = `<div class="bar"><span>vs <b>${esc(riv)}</b></span><span>Ronda <b>${Math.min(g.ronda || 1, RONDAS)}/${RONDAS}</b></span><span>Tú <b>${g.pts[p]}</b> · Rival <b>${g.pts[3-p]}</b></span><span>⏱ <b id="tm">—</b></span></div>`;
  if (g.estado === "fin"){
    h += `<div class="card"><h2 style="margin-top:0">Fin de la partida</h2><p class="msg"><b>${g.ganador === 0 ? "Empate" : g.ganador === p ? "¡Ganaste!" : "Perdiste"}</b></p>
      <p>Tú: <b>${g.pts[p]}</b> pts<br>${esc(riv)}: <b>${g.pts[3-p]}</b> pts</p><small>Se guardó en tu historial.</small></div><button data-go="partidas">Volver a mis partidas</button>`;
    $("v-sala").innerHTML = h; return;
  }
  if (!bat){
    const n = mis.length, cls = CL[FLOTA[n]], yaListo = g.listo[U.uid];
    h += yaListo ? `<p class="msg">Flota lista. Esperando a que ${esc(riv)} termine de colocar…</p><div class="rad" id="def">${radarH("def")}</div>`
      : `<p class="msg">${cls ? `Arrastra sobre el plano para colocar tu ${cls.n} (${cls.L} cuadros). ${n}/9` : "Flota completa: toca Listo."}</p>${msgP ? `<p class="msg">${msgP}</p>` : ""}
      <div class="rad" id="def">${radarH("def", null, true)}</div>
      <div class="row"><button class="sec" id="ori">${horiz ? "Horizontal" : "Vertical"} (al tocar)</button><button class="sec" id="undo" ${n ? "" : "disabled"}>Deshacer</button><button id="listo" ${n === 9 ? "" : "disabled"}>Listo</button></div>
      <p><small>Tus cuadrantes: ${PERM[p].join(", ")}. Los apagados no se pueden usar.</small></p>`;
  } else {
    const miT = g.turno === p && !g.ataque;
    h += `<p class="msg">${g.ataque ? "Resolviendo el ataque…" : miT ? (g.ronda <= 4 ? "Tu turno: ataque desde el origen, elige la pendiente m." : "Tu turno: elige m y b.") : "Turno de " + esc(riv) + "…"}</p>
      ${ult ? `<div class="card"><b>${esc(ultTxt(ult))}</b></div>` : ""}${msgP ? `<p class="msg">${msgP}</p>` : ""}
      <p><small>Barcos rivales tocados: ${esc(resumenH())}</small></p>
      <h2>Radar de ataque</h2><div class="rad" id="atk">${radarH("atk", {linea:miT ? leerRecta() : null})}</div>
      ${miT ? `<div class="row"><label>m (pendiente)<input id="m" type="number" step="0.1" inputmode="decimal" value="${esc(vm)}"></label>
        <label>b (eje Y)<input id="b" type="number" step="0.5" inputmode="decimal" value="${g.ronda <= 4 ? 0 : esc(vb)}" ${g.ronda <= 4 ? "disabled" : ""}></label><button id="fire">Disparar recta</button></div>` : ""}
      <h2>Mi radar de defensa</h2><div class="rad" id="def">${radarH("def")}</div>`;
  }
  $("v-sala").innerHTML = h;
  if (!bat && !g.listo[U.uid]){
    enlazarDrag();
    $("ori").onclick = () => { horiz = !horiz; pintarPartida(); };
    $("undo").onclick = () => { mis.pop(); msgP = ""; pintarPartida(); };
    $("listo").onclick = listo;
  }
  if (bat && g.turno === p && !g.ataque){
    const redib = () => { vm = $("m").value; vb = $("b").value; $("atk").innerHTML = radarH("atk", {linea:leerRecta()}); apuntar(); };
    $("m").oninput = redib; $("b").oninput = redib; $("fire").onclick = fuego;
  }
}
function leerRecta(){
  const m = parseFloat($("m")?.value ?? vm), b = G.ronda <= 4 ? 0 : parseFloat($("b")?.value ?? vb);
  return isNaN(m) || isNaN(b) ? null : {m, b};
}
function apuntar(){
  clearTimeout(aimT);
  aimT = setTimeout(() => { const r = leerRecta(); if (r) updateDoc(doc(db,"games",gid), {apunta:{p:yo, m:r.m, b:r.b}}).catch(() => {}); }, 500);
}

/* --- colocar barcos arrastrando --- */
function celdasDrag(cls){
  const dx = drag.c.x - drag.a.x, dy = drag.c.y - drag.a.y, h = dx || dy ? Math.abs(dx) >= Math.abs(dy) : horiz, s = (h ? dx : dy) < 0 ? -1 : 1;
  return Array.from({length:cls.L}, (_,i) => h ? {x:drag.a.x + i*s, y:drag.a.y} : {x:drag.a.x, y:drag.a.y + i*s});
}
const validas = cs => { const oc = new Set(mis.flatMap(s => s.celdas.map(kk))); return cs.every(c => c.x >= -NN && c.x < NN && c.y >= -NN && c.y < NN && PERM[yo].includes(quad(c.x,c.y)) && !oc.has(kk(c))); };
function enlazarDrag(){
  const el = $("def"), cls = CL[FLOTA[mis.length]]; if (!cls) return;
  const celda = e => { const s = el.querySelector("svg"), pt = s.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(s.getScreenCTM().inverse()); return {x:Math.floor(q.x), y:Math.floor(-q.y)}; };
  const dib = () => { const cs = celdasDrag(cls); el.innerHTML = radarH("def", {celdas:cs, ok:validas(cs)}, true); };
  el.onpointerdown = e => { drag = {a:celda(e), c:celda(e)}; el.setPointerCapture?.(e.pointerId); dib(); };
  el.onpointermove = e => { if (drag){ drag.c = celda(e); dib(); } };
  el.onpointerup = e => {
    if (!drag) return; drag.c = celda(e);
    const cs = celdasDrag(cls);
    if (validas(cs)){ mis.push({i:FLOTA[mis.length], k:mis.length, celdas:cs, dano:0, hund:false}); msgP = ""; }
    else msgP = "No cabe ahí: debe quedar en tus cuadrantes y sin tocar otro barco.";
    drag = null; pintarPartida();
  };
}
async function listo(){
  try {
    await setDoc(doc(db,"games",gid,"privado",U.uid), {ships:mis, gast:[]});
    await runTransaction(db, async tx => {
      const ref = doc(db,"games",gid), g = (await tx.get(ref)).data(), l = {...(g.listo || {}), [U.uid]:true}, patch = {listo:l};
      if (l[g.j1] && l[g.j2]) Object.assign(patch, {estado:"batalla", turno:1, ronda:1, tiempoFin:Date.now() + SEG*1000});
      tx.update(ref, patch);
    });
  } catch (e){ msgP = "No se pudo guardar tu flota. Inténtalo otra vez."; pintarPartida(); }
}

/* --- ataque, resolución y turnos --- */
async function fuego(){
  const r = leerRecta(); if (!r){ msgP = "Escribe valores válidos."; return pintarPartida(); }
  msgP = "";
  try { await updateDoc(doc(db,"games",gid), {ataque:{p:yo, m:r.m, b:r.b}, apunta:null}); } catch { msgP = "No se envió el ataque."; pintarPartida(); }
}
function avanzar(g, pts){
  let turno = g.turno, ronda = g.ronda;
  if (turno === 1) turno = 2; else { turno = 1; ronda++; }
  const r = {turno, ronda, tiempoFin:Date.now() + SEG*1000};
  if (ronda > RONDAS){ r.estado = "fin"; r.ganador = pts[1] > pts[2] ? 1 : pts[2] > pts[1] ? 2 : 0; }
  return r;
}
async function resolver(){          // lo hace el defensor: solo él conoce sus barcos
  resolviendo = true;
  try {
    const a = G.ataque, hits = []; let toca = false, suma = 0;
    for (const s of mis){
      const C = CL[s.i], tocados = s.celdas.filter(c => cruza(c, a.m, a.b));
      if (tocados.length) toca = true;
      const libres = tocados.filter(c => !gast.has(kk(c)));
      if (!libres.length) continue;
      libres.sort((u,v) => Math.hypot(u.x+.5, u.y+.5-a.b) - Math.hypot(v.x+.5, v.y+.5-a.b));   // el más cercano a (0, b)
      const c = libres[0], d = C.d[s.celdas.findIndex(z => z.x === c.x && z.y === c.y)];
      gast.add(kk(c)); s.dano += d;
      if (!s.hund && s.dano >= C.um){ s.hund = true; suma += C.pts; }
      hits.push({k:s.k, n:C.n, d, t:s.dano, h:s.hund});
    }
    const gana = mis.every(s => s.hund);
    await setDoc(doc(db,"games",gid,"privado",U.uid), {ships:mis, gast:[...gast]});
    await runTransaction(db, async tx => {
      const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
      if (!g.ataque) return;
      const pts = {...g.pts}; pts[a.p] = (pts[a.p] || 0) + suma;
      const patch = {lineas:[...(g.lineas || []), {p:a.p, m:a.m, b:a.b, rojo:toca, hits}], ataque:null, apunta:null, pts, ...avanzar(g, pts)};
      if (gana){ patch.estado = "fin"; patch.ganador = a.p; }
      tx.update(ref, patch);
    });
  } catch (e){ console.error(e); }
  resolviendo = false;
}
async function pasar(){             // se acabó el tiempo: se pierde el ataque
  if (pasando) return; pasando = true;
  try { await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
    if (g.estado !== "batalla" || g.ataque || Date.now() < g.tiempoFin) return;
    tx.update(ref, {...avanzar(g, g.pts), apunta:null});
  }); } catch {}
  pasando = false;
}
setInterval(() => {
  if (!G || !G.j2 || G.estado !== "batalla") return;
  const r = Math.ceil((G.tiempoFin - Date.now()) / 1000), e = $("tm");
  if (e) e.textContent = fmtT(r);
  if (!G.ataque && ((G.turno === yo && r <= 0) || r <= -4)) pasar();
}, 1000);

async function guardarFin(){
  const g = G, res = g.ganador === 0 ? "empate" : g.ganador === yo ? "victoria" : "derrota", ref = doc(db,"users",U.uid,"historial",gid);
  try {
    if ((await getDoc(ref)).exists()) return;
    const sol = l => ({m:l.m, b:l.b, rojo:l.rojo});
    await setDoc(ref, {resultado:res, rivalNombre:yo === 1 ? g.n2 : g.n1, miPuntaje:g.pts[yo], puntajeRival:g.pts[3-yo],
      mios:g.lineas.filter(l => l.p === yo).map(sol), rival:g.lineas.filter(l => l.p !== yo).map(sol),
      barcos:mis.map(s => ({c:CL[s.i].c, celdas:s.celdas})), fecha:serverTimestamp()});
    const campo = {victoria:"victorias", derrota:"derrotas", empate:"empates"}[res];
    await updateDoc(doc(db,"users",U.uid), {[campo]:increment(1), puntos:increment(g.pts[yo]), mejor:Math.max(P.mejor || 0, g.pts[yo])});
  } catch (e){ console.error(e); }
}

function pintarSala(id, g){
  $("v-sala").innerHTML = `<div class="card"><h2 style="margin-top:0">Sala de espera</h2><small>Código de la partida</small><div class="code">${esc(id)}</div>
    <p>Jugador 1: ${esc(g.n1)}<br>Jugador 2: ${esc(g.n2 || "esperando rival…")}</p>
    <p><b>${g.j2 ? "¡Los dos jugadores están dentro! El siguiente paso es colocar los barcos." : "Comparte el código con tu rival."}</b></p></div>
    <button class="sec" data-go="partidas">Volver a mis partidas</button>`;
}
function abrirSala(id){
  if (salaSub){ salaSub(); salaSub = null; }
  ir("sala");
  gid = null; salaSub = onSnapshot(doc(db,"games",id), s => { if (s.exists()) alCambiar(id, s.data()); });
}

/* ---------- Acciones (delegación de eventos) ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t || !U) return;
  const d = t.dataset;
  try {
    if (d.go) return ir(d.go);
    if (d.sala) return abrirSala(d.sala);
    if (t.id === "bCrear"){
      const id = cod(5);
      await setDoc(doc(db,"games",id), {j1:U.uid, n1:nombre(), j2:null, n2:null, jugadores:[U.uid], estado:"esperando", lineas:[], listo:{}, pts:{1:0,2:0}, creada:serverTimestamp()});
      return abrirSala(id);
    }
    if (t.id === "bUnir"){
      const id = $("codigo").value.trim().toUpperCase(), er = $("eInicio");
      if (id.length !== 5){ er.textContent = "El código tiene 5 caracteres."; return; }
      const ref = doc(db,"games",id), s = await getDoc(ref);
      if (!s.exists()){ er.textContent = "No existe una partida con ese código."; return; }
      const g = s.data();
      if (g.j1 !== U.uid && g.j2 !== U.uid){
        if (g.j2){ er.textContent = "Esa partida ya está llena."; return; }
        await updateDoc(ref, {j2:U.uid, n2:nombre(), estado:"colocando", jugadores:arrayUnion(U.uid), lineas:[], listo:{}, pts:{1:0,2:0}, turno:1, ronda:1});
      }
      return abrirSala(id);
    }
    if (t.id === "bAmigo"){
      const c = $("cAmigo").value.trim().toUpperCase(); msgAmigo = "";
      if (c.length !== 6) msgAmigo = "El código tiene 6 caracteres.";
      else {
        const s = await getDoc(doc(db,"codigos",c));
        if (!s.exists()) msgAmigo = "No existe ese código.";
        else if (s.data().uid === U.uid) msgAmigo = "Ese código es el tuyo.";
        else {
          const o = s.data(), id = [U.uid, o.uid].sort().join("_");
          await setDoc(doc(db,"amistades",id), {miembros:[U.uid,o.uid], nombres:{[U.uid]:nombre(), [o.uid]:o.nombre}, pedidoPor:U.uid, estado:"pendiente", creada:serverTimestamp()});
          msgAmigo = "✓ Solicitud enviada a " + o.nombre;
        }
      }
      return pintarAmigos();
    }
    if (d.acep) return await updateDoc(doc(db,"amistades",d.acep), {estado:"aceptada"});
    if (d.del) return await deleteDoc(doc(db,"amistades",d.del));
    if (t.id === "bNombre"){
      const n = $("pNombre").value.trim(); if (n.length < 3){ $("ePerfil").textContent = ERR.nombre; return; }
      await updateProfile(U, {displayName:n});
      await updateDoc(doc(db,"users",U.uid), {nombre:n});
      if (P.codigo) await updateDoc(doc(db,"codigos",P.codigo), {nombre:n});
      $("ePerfil").textContent = ""; return pintar();
    }
    if (t.id === "bCopiar"){ try { await navigator.clipboard.writeText(P.codigo || ""); t.textContent = "¡Copiado!"; } catch { t.textContent = P.codigo || ""; } return; }
    if (t.id === "bEjemplo") return await ejemplo();
    if (t.id === "bSalir") return signOut(auth);
  } catch (er){
    const x = $("eInicio") || $("ePerfil"); if (vista === "amigos"){ msgAmigo = texto(er); pintarAmigos(); } else if (x) x.textContent = texto(er);
  }
});
</script>
