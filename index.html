<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalla en el plano</title>
<style>
:root{--bg:#e8eef0;--card:#f6f9fa;--ink:#10303a;--mut:#5d7882;--line:#a9bec5;--acc:#0f6b7a;--on:#fff;--err:#b3261e;--ok:#2e7d32;--off:#d3dfe3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1d22;--card:#14292f;--ink:#dcebef;--mut:#8fa9b1;--line:#2c474f;--acc:#4fb3c6;--on:#06222a;--err:#ff8a80;--ok:#81c784;--off:#0f2227;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font:700 1.15rem Georgia,serif;margin:0}
h2{font:600 1.05rem Georgia,serif;margin:18px 0 8px}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.big{display:block;width:100%;padding:16px;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
input{width:100%;padding:11px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{padding:10px 14px;font:inherit;font-weight:600;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:var(--on);cursor:pointer}
button.sec{background:transparent;color:var(--acc)}
button.mini{padding:6px 10px;font-size:.85rem}
button.link{border:0;background:none;color:var(--acc);text-decoration:underline;padding:6px 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:700 1.6rem Georgia,serif}
.stats span,small,.mut{color:var(--mut);font-size:.85rem}
.err{color:var(--err);min-height:1.3em;margin:8px 0 0;font-size:.9rem}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;overflow:hidden;padding:0;border:0}
.av img{width:100%;height:100%;object-fit:cover}
.code{font:700 2rem ui-monospace,Menlo,monospace;letter-spacing:.2em}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
nav{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:0}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:4px;left:55%;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:.65rem;display:grid;place-items:center;padding:0 4px}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
details.h{border-bottom:1px solid var(--line);padding:8px 0}details.h:last-child{border:0}
.history-scroll{max-height:min(52vh,460px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:6px}
.history-scroll:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.history-scroll::-webkit-scrollbar{width:8px}.history-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.history-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:7px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.history-pager button{min-width:42px;padding:7px 12px}.history-pager button:disabled{opacity:.35;cursor:not-allowed}
.history-page-label{flex:1;text-align:center;font-size:.85rem;color:var(--mut)}.history-page-label b{display:block;color:var(--ink);font-size:.9rem}
.win{color:var(--ok)}.lose{color:var(--err)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}.bar b{color:var(--ink)}
.rad{margin:6px 0}
#splash{position:fixed;inset:0;z-index:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#16414d,#071419 72%);color:#dcebef;transition:opacity .6s,filter .6s,transform .6s}
#splash.dif{filter:blur(7px) brightness(.75);transform:scale(1.05)}
#splash.fuera{opacity:0;pointer-events:none}
.radar{width:150px;height:150px;margin:0 auto 12px}
.sweep{animation:giro 2.4s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.load{width:160px;height:4px;border-radius:2px;background:#ffffff26;margin:16px auto 0;overflow:hidden}
.load i{display:block;height:100%;width:40%;background:#4fb3c6;animation:barra 1.2s ease-in-out infinite}
@keyframes barra{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.sweep,.load i{animation:none}}
#auth{padding-top:10vh}
.glass{background:color-mix(in srgb,var(--card) 82%,transparent)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.centro{display:flex;flex-direction:column;gap:12px;text-align:center;padding:26px 0 18px}
.o{color:var(--mut);font-size:.85rem}
.dot2{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block;margin-right:8px}.on2{background:var(--ok)}
.frac{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:2px}
.fr{display:flex;flex-direction:column;align-items:center;width:92px}
.fr input{text-align:center}
.fr hr{width:100%;border:0;border-top:3px solid var(--ink);margin:5px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="splash"><div>
  <svg class="radar" viewBox="-50 -50 100 100" aria-hidden="true"><circle r="46" fill="none" stroke="#4fb3c6" stroke-opacity=".55"/><circle r="30" fill="none" stroke="#4fb3c6" stroke-opacity=".4"/><circle r="14" fill="none" stroke="#4fb3c6" stroke-opacity=".3"/><path d="M-50 0H50M0 -50V50" stroke="#4fb3c6" stroke-opacity=".35"/><g class="sweep"><path d="M0 0L46 0A46 46 0 0 0 32.5 -32.5Z" fill="#4fb3c6" fill-opacity=".38"/></g><circle cx="18" cy="-12" r="2.5" fill="#ff6b57"/><circle cx="-22" cy="16" r="2.5" fill="#e0a800"/></svg>
  <div style="font:700 1.9rem Georgia,serif">Batalla en el plano</div><small style="color:#8fa9b1">Cargando…</small><div class="load"><i></i></div>
</div></div>
<header id="hdr" hidden><button class="av" id="hAv" aria-label="Mi perfil"></button><h1>Batalla en el plano</h1><span style="width:36px"></span></header>
<main>
<section id="auth" hidden>
  <div class="card glass">
    <h2 id="tAuth" style="margin-top:0">Iniciar sesión</h2>
    <div id="fNombre" hidden><label for="nombre">Nombre de jugador</label><input id="nombre" maxlength="20"></div>
    <label for="email">Correo</label><input id="email" type="email" autocomplete="email">
    <label for="pass">Contraseña (mínimo 6 caracteres)</label><input id="pass" type="password">
    <p class="err" id="eAuth"></p>
    <div class="row"><button id="bEnviar">Entrar</button><button class="sec" id="bGoogle">Continuar con Google</button></div>
    <button class="link" id="bModo">Crear cuenta nueva</button><br>
    <button class="link" id="bReset">Olvidé mi contraseña</button>
  </div>
</section>

<div id="app" hidden>
  <section id="v-inicio"></section>
  <section id="v-partidas" hidden></section>
  <section id="v-amigos" hidden></section>
  <section id="v-perfil" hidden></section>
  <section id="v-sala" hidden></section>
</div>
</main>
<nav id="nav" hidden>
  <button data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</button>
  <button data-v="partidas"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>Partidas</button>
  <button data-v="amigos"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.500-6s6.500 2 6.500 6M17 5a3.500 3.500 0 010 6.500M21.500 20c0-3-1.500-5-4-5.800"/></svg>Amigos<i class="dot" id="dotA" hidden>0</i></button>
  <button data-v="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.500 3.500-7 8-7s8 2.500 8 7"/></svg>Perfil</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,updateProfile,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,doc,collection,query,where,setDoc,getDoc,updateDoc,deleteDoc,addDoc,increment,runTransaction,onSnapshot,arrayUnion,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyCUnK2WJZurAZXTkZEW_MPzIykH4mMByjU", authDomain:"prueba-2-df121.firebaseapp.com",
  projectId:"prueba-2-df121", storageBucket:"prueba-2-df121.firebasestorage.app",
  messagingSenderId:"147257342708", appId:"1:147257342708:web:81be883437b83c7e443ca1"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ERR = {
  "auth/invalid-credential":"Correo o contraseña incorrectos.","auth/invalid-email":"El correo no es válido.",
  "auth/email-already-in-use":"Ese correo ya tiene una cuenta. Inicia sesión.","auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
  "auth/popup-closed-by-user":"Cerraste la ventana de Google antes de terminar.","auth/too-many-requests":"Demasiados intentos. Espera un momento.",
  "permission-denied":"No se pudo completar. Puede que ya exista esa solicitud o amistad.","nombre":"El nombre debe tener al menos 3 caracteres."
};
const texto = e => e.m || ERR[e.code] || "Algo salió mal. Inténtalo de nuevo.";
const LET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const cod = n => Array.from({length:n}, () => LET[Math.floor(Math.random()*LET.length)]).join("");

let U = null, P = {}, kP = "", historial = [], paginaHistorial = 0, amDocs = {}, amSubs = [], amistades = [], partidas = [], errPartidas = "", subs = [], salaSub = null, vista = "inicio", modo = "entrar", msgAmigo = "";
const nombreDe = u => u.displayName || (u.email || "Jugador").split("@")[0];

/* ---------- Autenticación ---------- */
function pintarModo(){
  const c = modo === "crear";
  $("tAuth").textContent = c ? "Crear cuenta" : "Iniciar sesión";
  $("bEnviar").textContent = c ? "Crear cuenta" : "Entrar";
  $("bModo").textContent = c ? "Ya tengo cuenta" : "Crear cuenta nueva";
  $("fNombre").hidden = !c; $("eAuth").textContent = "";
}
$("bModo").onclick = () => { modo = modo === "crear" ? "entrar" : "crear"; pintarModo(); };
$("bEnviar").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value;
  try {
    if (modo === "crear"){
      const n = $("nombre").value.trim(); if (n.length < 3) throw {code:"nombre"};
      let fin; espera = new Promise(r => fin = r);
      try {
        const c = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(c.user, {displayName:n});
      } finally { fin(); }
    } else await signInWithEmailAndPassword(auth, email, pass);
  } catch (e){ $("eAuth").textContent = texto(e); }
};
$("bGoogle").onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e){ $("eAuth").textContent = texto(e); } };
$("bReset").onclick = async () => {
  const email = $("email").value.trim();
  if (!email){ $("eAuth").textContent = "Escribe tu correo y vuelve a tocar el enlace."; return; }
  try { await sendPasswordResetEmail(auth, email); $("eAuth").textContent = "Te enviamos un correo para restablecerla."; } catch (e){ $("eAuth").textContent = texto(e); }
};

let espera = Promise.resolve();
const pausa = () => new Promise(r => setTimeout(r, Math.max(0, 1600 - performance.now())));   // deja ver la pantalla de carga
const latido = () => { if (U) updateDoc(doc(db,"users",U.uid), {visto:Date.now()}).catch(() => {}); };   // "estoy en línea"
setInterval(() => { latido(); const e = $("listaAm"); if (vista === "inicio" && e) e.innerHTML = htmlAmigos(); }, 30000);
onAuthStateChanged(auth, async u => {
  await espera; espera = Promise.resolve();
  subs.forEach(f => f()); subs = []; amSubs.forEach(f => f()); amSubs = []; amDocs = {}; kP = ""; if (salaSub){ salaSub(); salaSub = null; }
  U = u;
  const spl = $("splash");
  if (!u){ await pausa(); spl.classList.remove("fuera"); spl.classList.add("dif"); $("auth").hidden = false; $("app").hidden = $("nav").hidden = $("hdr").hidden = true; pintarModo(); return; }
  await prepararPerfil(u);
  await pausa(); spl.classList.add("fuera"); latido();
  $("auth").hidden = true; $("app").hidden = $("nav").hidden = $("hdr").hidden = false;
  subs.push(onSnapshot(doc(db,"users",u.uid), s => { const d = s.data() || {}, k = JSON.stringify({...d, visto:0}); P = s.data() || P; if (k !== kP){ kP = k; pintar(); } }));
  subs.push(onSnapshot(query(collection(db,"amistades"), where("miembros","array-contains",u.uid)), s => { amistades = s.docs.map(d => ({id:d.id, ...d.data()})); suscribirAmigos(); pintar(); }));
  subs.push(onSnapshot(query(collection(db,"games"), where("jugadores","array-contains",u.uid)), s => { partidas = s.docs.map(d => ({id:d.id, ...d.data()})); errPartidas = ""; pintar(); },
    e => { console.error("partidas:", e); errPartidas = e.code || "error"; pintar(); }));
  subs.push(onSnapshot(collection(db,"users",u.uid,"historial"), s => { historial = s.docs.map(d => ({id:d.id, ...d.data()})); pintar(); }));
  ir("inicio");
});

async function prepararPerfil(u){
  const ref = doc(db,"users",u.uid);
  try {
    const actual = await getDoc(ref), d = actual.exists() ? actual.data() : {};
    if (d.codigo) return;
    // La transacción evita que dos sesiones creen códigos distintos para la misma cuenta
    // y comprueba que el código no esté ocupado antes de reservarlo.
    for (let intento = 0; intento < 8; intento++){
      const codigo = cod(6), codigoRef = doc(db,"codigos",codigo);
      try {
        await runTransaction(db, async tx => {
          const [perfil, ocupado] = await Promise.all([tx.get(ref), tx.get(codigoRef)]);
          if (perfil.exists() && perfil.data().codigo) return;
          if (ocupado.exists()) throw new Error("Código ocupado");
          tx.set(codigoRef, {uid:u.uid, nombre:nombreDe(u)});
          tx.set(ref, {nombre:d.nombre || nombreDe(u), codigo, victorias:d.victorias || 0, derrotas:d.derrotas || 0, empates:d.empates || 0, creado:d.creado || serverTimestamp()}, {merge:true});
        });
        return;
      } catch (e){ if (e.message !== "Código ocupado" || intento === 7) throw e; }
    }
  } catch (e){ console.error("No se pudo preparar el perfil:", e); }
}

/* ---------- Navegación ---------- */
const VISTAS = ["inicio","partidas","amigos","perfil","sala"];
function ir(v){
  vista = v;
  VISTAS.forEach(x => $("v-"+x).hidden = x !== v);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === (v === "sala" ? "partidas" : v)));
  pintar(); window.scrollTo(0,0);
}
$("nav").onclick = e => { const b = e.target.closest("button"); if (b) ir(b.dataset.v); };
$("hAv").onclick = () => ir("perfil");

/* ---------- Pintar vistas ---------- */
const nombre = () => P.nombre || (U && nombreDe(U)) || "Jugador";
const rival = g => g.j1 === U.uid ? g.n2 : g.n1;
const estadoTxt = g => g.estado === "fin" ? "Terminada" : g.j2 ? "En curso" : "Esperando rival";
const pendientes = () => amistades.filter(a => a.estado === "pendiente" && a.pedidoPor !== U.uid);
const otro = a => a.miembros.find(m => m !== U.uid);

function pintar(){
  if (!U) return;
  const av = $("hAv");
  av.innerHTML = U.photoURL ? `<img src="${esc(U.photoURL)}" alt="" referrerpolicy="no-referrer">` : esc(nombre()[0].toUpperCase());
  const n = pendientes().length; $("dotA").hidden = !n; $("dotA").textContent = n;
  if (vista === "inicio") pintarInicio();
  if (vista === "partidas") pintarPartidas();
  if (vista === "amigos") pintarAmigos();
  if (vista === "perfil") pintarPerfil();
}

function htmlAmigos(){
  const ac = amistades.filter(a => a.estado === "aceptada"), ahora = Date.now();
  if (!ac.length) return `<p class="mut">Aún no tienes amigos. Agrégalos con su código.</p>`;
  return ac.map(a => { const id = otro(a), on = ahora - ((amDocs[id] || {}).visto || 0) < 75000;
    return `<div class="item"><span><i class="dot2 ${on ? "on2" : ""}"></i>${esc(a.nombres?.[id] || "Jugador")}</span><small>${on ? "En línea" : "Desconectado"}</small></div>`; }).join("");
}
function suscribirAmigos(){
  amSubs.forEach(f => f()); amSubs = [];
  for (const a of amistades.filter(a => a.estado === "aceptada")){
    const id = otro(a);
    amSubs.push(onSnapshot(doc(db,"users",id), s => { amDocs[id] = s.data() || {}; const e = $("listaAm"); if (vista === "inicio" && e) e.innerHTML = htmlAmigos(); }));
  }
}
function pintarInicio(){
  const cv = $("codigo")?.value || "";
  $("v-inicio").innerHTML = `<div class="centro"><h2 style="margin:0">Hola, ${esc(nombre())}</h2>
    <button class="big" id="bCrear">Crear partida</button><div class="o">o</div>
    <div class="row"><input id="codigo" maxlength="5" style="text-transform:uppercase;text-align:center" placeholder="Código de la partida" value="${esc(cv)}"><button id="bUnir">Unirse</button></div>
    <p class="err" id="eInicio"></p></div>
    <h2 style="display:flex;justify-content:space-between;align-items:center">Amigos <button class="mini sec" data-go="amigos">Agregar</button></h2>
    <div class="card" id="listaAm">${htmlAmigos()}</div>`;
}
const PAUSA_TXT = {solicitada:"Pausa solicitada", pausada:"Pausada", reanudar:"Esperando reanudación"};
const enPausa = g => g.estado !== "fin" && !!(g.pausa && PAUSA_TXT[g.pausa.estado]);
function filaPartida(g){
  const pa = enPausa(g);
  return `<div class="item"><div><b>${esc(g.id)}</b> <span class="tag">${pa ? PAUSA_TXT[g.pausa.estado] : estadoTxt(g)}</span><br><small>Rival: ${esc(rival(g) || "esperando…")}</small></div><button class="mini" data-sala="${esc(g.id)}">${pa ? "Continuar" : "Abrir"}</button></div>`;
}
function pintarPartidas(){
  const l = [...partidas].sort((a,b) => (b.creada?.seconds || 0) - (a.creada?.seconds || 0));
  const pausadas = l.filter(enPausa), otras = l.filter(g => !enPausa(g));
  let h = `<h2 style="margin-top:6px">Mis partidas</h2>`;
  if (errPartidas) h += `<div class="card"><p class="err">No se pudieron cargar tus partidas (${esc(errPartidas)}). Revisa que las reglas de Firestore estén publicadas y recarga la página.</p></div>`;
  if (!l.length && !errPartidas) h += `<div class="card"><p class="mut">Aún no tienes partidas. Crea una desde Inicio.</p></div>`;
  if (pausadas.length) h += `<h2>Partidas pausadas</h2><div class="card">${pausadas.map(filaPartida).join("")}</div>`;
  if (otras.length) h += `<h2>Otras partidas</h2><div class="card">${otras.map(filaPartida).join("")}</div>`;
  $("v-partidas").innerHTML = h;
}

function pintarAmigos(){
  const acept = amistades.filter(a => a.estado === "aceptada");
  const rec = pendientes(), env = amistades.filter(a => a.estado === "pendiente" && a.pedidoPor === U.uid);
  const fila = (a, bot) => `<div class="item"><span>${esc(a.nombres?.[otro(a)] || "Jugador")}</span><span>${bot}</span></div>`;
  $("v-amigos").innerHTML = `<h2 style="margin-top:6px">Amigos</h2>
    <div class="card"><label for="cAmigo" style="margin-top:0">Agregar amigo con su código</label>
      <div class="row"><input id="cAmigo" maxlength="6" style="text-transform:uppercase" placeholder="Código de 6 letras"><button id="bAmigo">Enviar</button></div>
      <p class="${msgAmigo.startsWith("✓") ? "mut" : "err"}">${esc(msgAmigo)}</p></div>
    ${rec.length ? `<h2>Solicitudes</h2><div class="card">${rec.map(a => fila(a, `<button class="mini" data-acep="${a.id}">Aceptar</button> <button class="mini sec" data-del="${a.id}">Rechazar</button>`)).join("")}</div>` : ""}

}

function pintarPerfil(){

    <div class="card"><div class="stats" style="row-gap:14px"><div><b>${j}</b><span>Jugadas</span></div><div><b>${v}</b><span>Victorias</span></div><div><b>${d}</b><span>Derrotas</span></div>
      <div><b>${e}</b><span>Empates</span></div><div><b>${wr}%</b><span>Win rate</span></div><div><b>${P.mejor || 0}</b><span>Mejor puntaje</span></div></div></div>
    <h2>Historial</h2><div class="card">${lista.length ? `<div class="history-pager" aria-label="Páginas del historial"><button class="mini sec" data-hist-page="-1" aria-label="Página anterior" ${paginaHistorial === 0 ? "disabled" : ""}>←</button><div class="history-page-label"><b>Pestaña ${paginaHistorial + 1} de ${totalPaginas}</b>Partidas ${inicioHistorial + 1}–${Math.min(inicioHistorial + porPagina, lista.length)} de ${lista.length}</div><button class="mini sec" data-hist-page="1" aria-label="Página siguiente" ${paginaHistorial >= totalPaginas - 1 ? "disabled" : ""}>→</button></div><div class="history-scroll" role="region" aria-label="Partidas de esta pestaña">${paginaLista.map(h => { const r = RES[h.resultado] || ["Partida",""]; return `<details class="h"><summary class="item" style="padding:0;border:0"><div style="width:76px;flex:none">${mini(h,"riv")}</div><div style="flex:1"><b class="${r[1]}">${r[0]}</b> vs ${esc(h.rivalNombre)}${h.prueba ? ' <span class="tag">Prueba</span>' : ""}${h.abandono ? ' <span class="tag">Abandono</span>' : ""}<br><small>${Number(h.miPuntaje)} – ${Number(h.puntajeRival)} pts · ${fecha(h)}</small></div></summary><div class="two"><div><small>Mi plano</small>${mini(h,"mio")}</div><div><small>Plano de ${esc(h.rivalNombre)}</small>${mini(h,"riv")}</div></div><small>Barcos apagados: derribados. ✕: cuadros dañados. Rojo: recta que tocó barcos; amarillo: no tocó.</small></details>`; }).join("")}</div>` : `<p class="mut">Aún no hay partidas. Cuando termines una, aparecerá aquí con la vista previa de los ataques.</p>`}
      <button class="mini sec" id="bEjemplo" style="margin-top:10px">Agregar partida de prueba (no cuenta en estadísticas)</button></div>
    <div class="card"><small>Tu código de amigo</small><div class="code" style="font-size:1.6rem">${esc(P.codigo || "…")}</div>
      <button class="mini sec" id="bCopiar" style="margin-top:8px">Copiar código</button></div>
    <button class="sec big" id="bSalir">Cerrar sesión</button>`;
}

const fecha = h => h.fecha?.seconds ? new Date(h.fecha.seconds * 1000).toLocaleDateString("es") : "";
function mini(h, modo){   // "mio": mi plano (mis barcos + ataques del rival) · "riv": plano del rival (sus barcos + mis ataques)
  const mio = modo === "mio", flota = (mio ? h.barcos : h.barcosRival) || [], lin = (mio ? h.rival : h.mios) || [], gs = new Set((mio ? h.gast : h.gastRival) || []);
  let g = "";
  for (let x = -6; x < 6; x++) for (let y = -6; y < 6; y++) g += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--card)" stroke="var(--line)" stroke-width=".03"/>`;
  for (const b of flota) for (const c of b.celdas){
    const x = Number(c.x), y = Number(c.y);
    g += `<rect x="${x + .06}" y="${y + .06}" width=".88" height=".88" rx=".12" fill="${esc(b.c)}" opacity="${b.hund ? .45 : 1}"/>`;
    if (gs.has(x + "," + y)) g += `<path d="M${x + .25} ${y + .25}L${x + .75} ${y + .75}M${x + .75} ${y + .25}L${x + .25} ${y + .75}" stroke="#fff" stroke-width=".1"/>`;
  }
  g += `<path d="M-7 0H7M0 -7V7" stroke="var(--ink)" stroke-width=".07"/>`;
  for (const l of lin){
    const m = Number(l.m), b = Number(l.b);
    g += `<line x1="-8" y1="${m * -8 + b}" x2="8" y2="${m * 8 + b}" stroke="${l.rojo ? "var(--err)" : "#e0a800"}" stroke-width=".13" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="-6.2 -6.2 12.4 12.4" style="display:block;width:100%;border:1px solid var(--line);border-radius:6px"><g transform="scale(1,-1)">${g}</g></svg>`;
}
// Partida de prueba: aparece en el historial, pero NO suma a las estadísticas.
async function ejemplo(){
  const lin = n => Array.from({length:n}, () => ({m:Math.round((Math.random() * 4 - 2) * 2) / 2, b:Math.round(Math.random() * 8 - 4), rojo:Math.random() < .5}));

    barcos:[{c:"#3a6ea5", celdas:[0,1,2,3].map(i => ({x:i, y:2})), hund:true}, {c:"#4a9a5a", celdas:[{x:-3, y:-2}, {x:-3, y:-1}], hund:false}], gast:["0,2","1,2","-3,-2"],

/* ================= PARTIDA ONLINE ================= */
const PERM = {1:[1,2,4], 2:[2,3,4]}, RONDAS = 10, SEG = 90, NN = 6;
const CL = [
  {n:"Portaaviones", L:4, pts:100, um:70, d:[20,50,50,20], c:"#3a6ea5", q:2},
  {n:"Acorazado",    L:3, pts:90,  um:65, d:[25,45,25],    c:"#c9772b", q:2},
  {n:"Destructor",   L:2, pts:60,  um:50, d:[30,30],       c:"#4a9a5a", q:3},
  {n:"Submarino",    L:2, pts:30,  um:50, d:[50,50],       c:"#7b5ea7", q:2}
];
const FLOTA = CL.flatMap((c,i) => Array(c.q).fill(i));
const quad = (x,y) => x>=0&&y>=0 ? 1 : x<0&&y>=0 ? 2 : x<0&&y<0 ? 3 : 4;
const kk = c => c.x + "," + c.y;
const cruza = (c,m,b) => { const v = [[0,0],[1,0],[0,1],[1,1]].map(([i,j]) => c.y+j - m*(c.x+i) - b); return Math.min(...v) < -1e-9 && Math.max(...v) > 1e-9; };
const fmtT = r => Math.floor(Math.max(r,0)/60) + ":" + String(Math.max(r,0)%60).padStart(2,"0");
let G = null, gid = null, yo = 0, mis = [], gast = new Set(), drag = null, horiz = true, vmn = "1", vmd = "1", vb = "0",
    huella = "", resolviendo = false, pasando = false, guardado = false, publicado = false, msgP = "", aimT = null;

async function alCambiar(id, g){
  g.lineas = g.lineas || []; g.listo = g.listo || {}; g.pts = g.pts || {1:0,2:0};
  if (id !== gid){
    gid = id; mis = []; gast = new Set(); guardado = false; publicado = false; msgP = ""; huella = ""; G = g; yo = g.j1 === U.uid ? 1 : 2;
    try { const s = await getDoc(doc(db,"games",id,"privado",U.uid)); if (s.exists()){ mis = s.data().ships; gast = new Set(s.data().gast); } } catch {}
  }
  G = g; yo = g.j1 === U.uid ? 1 : 2;
  if (!g.j2){ huella = ""; return pintarSala(id, g); }
  const pausaActiva = g.pausa && (g.pausa.estado === "pausada" || g.pausa.estado === "reanudar");
  if (g.ataque && g.ataque.p !== yo && !resolviendo && !pausaActiva) resolver();
  if (g.estado === "fin"){
    const f = g.finales || {};
    if (!f[U.uid] && !publicado){ publicado = true; updateDoc(doc(db,"games",gid), {[`finales.${U.uid}`]:{ships:mis, gast:[...gast]}}).catch(() => {}); }
    if (g.cancelada) guardado = true;
    if (!guardado && f[U.uid] && (f[yo === 1 ? g.j2 : g.j1] || g.abandonoPor)){ guardado = true; guardarFin(); }
  }
  const h = JSON.stringify([g.estado, g.turno, g.ronda, g.lineas.length, !!g.ataque, g.listo, g.pts, g.pausa || null]);
  if (h !== huella){ huella = h; pintarPartida(); }
  else if (g.apunta && g.apunta.p !== yo && $("def")) $("def").innerHTML = radarH("def");
}

/* --- dibujo --- */
const ln = (m,b,c,w,d) => `<line x1="-8" y1="${m*-8+b}" x2="8" y2="${m*8+b}" stroke="${c}" stroke-width="${w}" ${d ? `stroke-dasharray="${d}"` : ""} stroke-linecap="round"/>`;
function radarH(modo, prev, place){
  const p = modo === "def" ? yo : 3 - yo, zona = PERM[p];
  let g = "";
  for (let x=-NN; x<NN; x++) for (let y=-NN; y<NN; y++) g += `<rect x="${x}" y="${y}" width="1" height="1" fill="${zona.includes(quad(x,y)) ? "var(--card)" : "var(--off)"}" stroke="var(--line)" stroke-width=".03"/>`;
  if (modo === "def") for (const s of mis) for (const c of s.celdas){
    g += `<rect x="${c.x+.06}" y="${c.y+.06}" width=".88" height=".88" rx=".12" fill="${CL[s.i].c}" opacity="${s.hund ? .45 : 1}"/>`;
    if (gast.has(kk(c))) g += `<path d="M${c.x+.25} ${c.y+.25}L${c.x+.75} ${c.y+.75}M${c.x+.75} ${c.y+.25}L${c.x+.25} ${c.y+.75}" stroke="#fff" stroke-width=".1"/>`;
  }
  if (prev && prev.celdas) for (const c of prev.celdas) g += `<rect x="${c.x}" y="${c.y}" width="1" height="1" fill="${prev.ok ? "#2e7d32" : "#d23a2a"}" opacity=".55"/>`;
  g += `<path d="M-7 0H7M0 -7V7" stroke="var(--ink)" stroke-width=".07"/>`;
  for (const l of G.lineas.filter(l => modo === "atk" ? l.p === yo : l.p !== yo)) g += ln(l.m, l.b, l.rojo ? "var(--err)" : "#e0a800", .1, "");
  if (modo === "def" && G.apunta && G.apunta.p !== yo) g += ln(G.apunta.m, G.apunta.b, "var(--err)", .06, ".25 .2");
  if (prev && prev.linea) g += ln(prev.linea.m, prev.linea.b, "var(--acc)", .08, ".25 .2");
  let t = "";
  for (let i=-6; i<=6; i+=2) if (i) t += `<text x="${i}" y="-.3" font-size=".5" text-anchor="middle" fill="var(--mut)">${i}</text><text x=".2" y="${-i+.17}" font-size=".5" fill="var(--mut)">${i}</text>`;
  return `<svg viewBox="-6.4 -6.4 12.8 12.8" style="display:block;width:100%;border:1px solid var(--line);border-radius:6px;${place ? "touch-action:none" : ""}"><g transform="scale(1,-1)">${g}</g>${t}</svg>`;
}
const mTxt = l => l.md != null ? (l.md === 1 ? String(l.mn) : l.mn + "/" + l.md) : String(Math.round(l.m * 1000) / 1000);
const ultTxt = l => `${l.p === yo ? "Tu ataque" : "Ataque rival"} (y = ${mTxt(l)}x + ${l.b}): ${l.rojo ? "tocó barcos" : "no tocó ningún barco"}. ` + (l.hits || []).map(h => `${h.n} −${h.d}%${h.h ? " ¡derribado!" : ""}`).join(" | ");
function resumenH(){
  const m = new Map(); for (const l of G.lineas.filter(l => l.p === yo)) for (const h of l.hits || []) m.set(h.k, h);
  const v = [...m.values()], tot = {}, c = {}; v.forEach(h => tot[h.n] = (tot[h.n] || 0) + 1);
  return v.length ? v.map(h => { c[h.n] = (c[h.n] || 0) + 1; return `${h.n}${tot[h.n] > 1 ? " " + c[h.n] : ""}: ${h.h ? "derribado" : h.t + "%"}`; }).join(" · ") : "ninguno todavía";
}
function pintarPartida(){
  const g = G, p = yo, riv = p === 1 ? g.n2 : g.n1, bat = g.estado === "batalla", ult = g.lineas[g.lineas.length - 1];
  const pa = g.pausa || null, congelada = !!(pa && (pa.estado === "pausada" || pa.estado === "reanudar"));
  let h = `<div class="bar"><span>vs <b>${esc(riv)}</b></span><span>Ronda <b>${Math.min(g.ronda || 1, RONDAS)}/${RONDAS}</b></span><span>Tú <b>${g.pts[p]}</b> · Rival <b>${g.pts[3-p]}</b></span><span>⏱ <b id="tm">${congelada ? "Pausado" : "—"}</b></span></div>`;
  if (g.estado === "fin"){
    h += `<div class="card"><h2 style="margin-top:0">Fin de la partida</h2><p class="msg"><b>${g.cancelada ? "Partida cancelada: nadie terminó de colocar a tiempo." : g.ganador === 0 ? "Empate" : g.ganador === p ? "¡Ganaste!" : "Perdiste"}</b></p>${g.abandonoPor ? `<p>${g.abandonoPor === p ? "Abandonaste la partida." : esc(riv) + " abandonó la partida."}</p>` : ""}
      <p>Tú: <b>${g.pts[p]}</b> pts<br>${esc(riv)}: <b>${g.pts[3-p]}</b> pts</p>${g.cancelada ? "" : "<small>Se guardó en tu historial.</small>"}</div><button data-go="partidas">Volver a mis partidas</button>`;
    $("v-sala").innerHTML = h; return;
  }
  if (congelada){
    const yaPidioReanudar = pa.confirmacionesReanudar && pa.confirmacionesReanudar[U.uid];
    h += `<div class="card"><h2 style="margin-top:0">Partida pausada</h2><p>${pa.estado === "reanudar" && yaPidioReanudar ? "Confirmaste reanudar. Esperando a que tu rival también pulse Reanudar partida." : "Los dos jugadores deben pulsar Reanudar partida para continuar."}</p><button id="reanudarPartida" ${yaPidioReanudar ? "disabled" : ""}>Reanudar partida</button></div>`;
  } else if (!bat){
    const n = mis.length, cls = CL[FLOTA[n]], yaListo = g.listo[U.uid];
    h += yaListo ? `<p class="msg">Flota lista. Esperando a que ${esc(riv)} termine de colocar…</p><div class="rad" id="def">${radarH("def")}</div>`
      : `<p class="msg">${cls ? `Arrastra sobre el plano para colocar tu ${cls.n} (${cls.L} cuadros). ${n}/9` : "Flota completa: toca Listo."}</p>${msgP ? `<p class="msg">${msgP}</p>` : ""}
      <div class="rad" id="def">${radarH("def", null, true)}</div>
      <div class="row"><button class="sec" id="ori">${horiz ? "Horizontal" : "Vertical"} (al tocar)</button><button class="sec" id="undo" ${n ? "" : "disabled"}>Deshacer</button><button id="listo" ${n === 9 ? "" : "disabled"}>Listo</button></div>
      <p><small>Tus cuadrantes: ${PERM[p].join(", ")}. Los apagados no se pueden usar.</small></p>`;
  } else {
    const miT = g.turno === p && !g.ataque;
    h += `<p class="msg">${g.ataque ? "Resolviendo el ataque…" : miT ? (g.ronda <= 4 ? "Tu turno: ataque desde el origen, elige la pendiente m." : "Tu turno: elige m y b.") : "Turno de " + esc(riv) + "…"}</p>
      ${ult ? `<div class="card"><b>${esc(ultTxt(ult))}</b></div>` : ""}${msgP ? `<p class="msg">${msgP}</p>` : ""}
      <p><small>Barcos rivales tocados: ${esc(resumenH())}</small></p>
      <h2>Radar de ataque</h2><div class="rad" id="atk">${radarH("atk", {linea:miT ? leerRecta() : null})}</div>
      ${miT ? `<div class="row"><div class="frac">m (pendiente)<div class="fr"><input id="mn" type="number" step="any" inputmode="decimal" aria-label="Numerador de m" value="${esc(vmn)}"><hr><input id="md" type="number" step="any" inputmode="decimal" aria-label="Denominador de m" value="${esc(vmd)}"></div></div>
        <label>b (eje Y)<input id="b" type="number" step="0.5" inputmode="decimal" value="${g.ronda <= 4 ? 0 : esc(vb)}" ${g.ronda <= 4 ? "disabled" : ""}></label><button id="fire">Disparar recta</button></div>` : ""}
      <h2>Mi radar de defensa</h2><div class="rad" id="def">${radarH("def")}</div>`;
  }
  if (pa && pa.estado === "solicitada"){
    const yoSolicite = pa.solicitadaPor === U.uid;
    h += `<div class="card"><b>Solicitud de pausa</b><p>${yoSolicite ? "Esperando a que tu rival confirme la pausa." : esc(riv) + " quiere pausar la partida. ¿Aceptas?"}</p>${yoSolicite ? "" : `<button id="confirmarPausa">Confirmar pausa</button>`}</div>`;
  } else if (!congelada){
    h += `<div class="row" style="margin-top:16px"><button class="sec" id="solicitarPausa">Pausa</button></div>`;
  }
  h += `<div class="row" style="margin-top:10px"><button class="sec" id="abandonar">Abandonar partida</button></div>`;
  $("v-sala").innerHTML = h; $("abandonar").onclick = abandonar;
  if (congelada) return;
  if (!bat && !g.listo[U.uid]){
    enlazarDrag();
    $("ori").onclick = () => { horiz = !horiz; pintarPartida(); };
    $("undo").onclick = () => { mis.pop(); msgP = ""; pintarPartida(); };
    $("listo").onclick = listo;
  }
  if (bat && g.turno === p && !g.ataque){
    const redib = () => { vmn = $("mn").value; vmd = $("md").value; vb = $("b").value; $("atk").innerHTML = radarH("atk", {linea:leerRecta()}); apuntar(); };
    $("mn").oninput = redib; $("md").oninput = redib; $("b").oninput = redib; $("fire").onclick = fuego;
  }
}
function leerRecta(){
  const mn = parseFloat($("mn")?.value ?? vmn), md = parseFloat($("md")?.value ?? vmd), m = mn / md;
  const b = G.ronda <= 4 ? 0 : parseFloat($("b")?.value ?? vb);
  return isNaN(m) || !isFinite(m) || isNaN(b) ? null : {m, b, mn, md};
}
function apuntar(){
  clearTimeout(aimT);
  aimT = setTimeout(() => { const r = leerRecta(); if (r) updateDoc(doc(db,"games",gid), {apunta:{p:yo, m:r.m, b:r.b}}).catch(() => {}); }, 500);
}

/* --- colocar barcos arrastrando --- */
function celdasDrag(cls){
  const dx = drag.c.x - drag.a.x, dy = drag.c.y - drag.a.y, h = dx || dy ? Math.abs(dx) >= Math.abs(dy) : horiz, s = (h ? dx : dy) < 0 ? -1 : 1;
  return Array.from({length:cls.L}, (_,i) => h ? {x:drag.a.x + i*s, y:drag.a.y} : {x:drag.a.x, y:drag.a.y + i*s});
}
const validas = cs => { const oc = new Set(mis.flatMap(s => s.celdas.map(kk))); return cs.every(c => c.x >= -NN && c.x < NN && c.y >= -NN && c.y < NN && PERM[yo].includes(quad(c.x,c.y)) && !oc.has(kk(c))); };
function enlazarDrag(){
  const el = $("def"), cls = CL[FLOTA[mis.length]]; if (!cls) return;
  const celda = e => { const s = el.querySelector("svg"), pt = s.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(s.getScreenCTM().inverse()); return {x:Math.floor(q.x), y:Math.floor(-q.y)}; };
  const dib = () => { const cs = celdasDrag(cls); el.innerHTML = radarH("def", {celdas:cs, ok:validas(cs)}, true); };
  el.onpointerdown = e => { drag = {a:celda(e), c:celda(e)}; el.setPointerCapture?.(e.pointerId); dib(); };
  el.onpointermove = e => { if (drag){ drag.c = celda(e); dib(); } };
  el.onpointerup = e => {
    if (!drag) return; drag.c = celda(e);
    const cs = celdasDrag(cls);
    if (validas(cs)){ mis.push({i:FLOTA[mis.length], k:mis.length, celdas:cs, dano:0, hund:false}); msgP = ""; }
    else msgP = "No cabe ahí: debe quedar en tus cuadrantes y sin tocar otro barco.";
    drag = null; pintarPartida();
  };
}
async function listo(){
  try {
    await setDoc(doc(db,"games",gid,"privado",U.uid), {ships:mis, gast:[]});
    await runTransaction(db, async tx => {
      const ref = doc(db,"games",gid), g = (await tx.get(ref)).data(), l = {...(g.listo || {}), [U.uid]:true}, patch = {listo:l};
      if (l[g.j1] && l[g.j2]) Object.assign(patch, {estado:"batalla", turno:1, ronda:1, tiempoFin:Date.now() + SEG*1000});
      tx.update(ref, patch);
    });
  } catch (e){ msgP = "No se pudo guardar tu flota. Inténtalo otra vez."; pintarPartida(); }
}

/* --- ataque, resolución y turnos --- */
async function fuego(){
  const r = leerRecta();
  if (!r || !Number.isFinite(r.m) || !Number.isFinite(r.b) || Math.abs(r.m) > 20 || Math.abs(r.b) > 20){
    msgP = "Escribe números válidos: el denominador no puede ser 0 y la pendiente y b deben quedar entre -20 y 20."; return pintarPartida();
  }
  msgP = "";
  try { await updateDoc(doc(db,"games",gid), {ataque:{p:yo, m:r.m, b:r.b, mn:r.mn, md:r.md}, apunta:null}); } catch { msgP = "No se envió el ataque."; pintarPartida(); }
}
function avanzar(g, pts){
  let turno = g.turno, ronda = g.ronda;
  if (turno === 1) turno = 2; else { turno = 1; ronda++; }
  const r = {turno, ronda, tiempoFin:Date.now() + SEG*1000};
  if (ronda > RONDAS){ r.estado = "fin"; r.ganador = pts[1] > pts[2] ? 1 : pts[2] > pts[1] ? 2 : 0; }
  return r;
}
async function resolver(){          // lo hace el defensor: solo él conoce sus barcos
  resolviendo = true;
  try {
    const a = G.ataque, hits = []; let toca = false, suma = 0;
    for (const s of mis){
      const C = CL[s.i], tocados = s.celdas.filter(c => cruza(c, a.m, a.b));
      if (tocados.length) toca = true;
      const libres = tocados.filter(c => !gast.has(kk(c)));
      if (!libres.length) continue;
      libres.sort((u,v) => Math.hypot(u.x+.5, u.y+.5-a.b) - Math.hypot(v.x+.5, v.y+.5-a.b));   // el más cercano a (0, b)
      const c = libres[0], d = C.d[s.celdas.findIndex(z => z.x === c.x && z.y === c.y)];
      gast.add(kk(c)); s.dano += d;
      if (!s.hund && s.dano >= C.um){ s.hund = true; suma += C.pts; }
      hits.push({k:s.k, n:C.n, d, t:s.dano, h:s.hund});
    }
    const gana = mis.every(s => s.hund);
    await setDoc(doc(db,"games",gid,"privado",U.uid), {ships:mis, gast:[...gast]});
    await runTransaction(db, async tx => {
      const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
      if (!g.ataque) return;
      const pts = {...g.pts}; pts[a.p] = (pts[a.p] || 0) + suma;
      const patch = {lineas:[...(g.lineas || []), {p:a.p, m:a.m, b:a.b, mn:a.mn ?? null, md:a.md ?? null, rojo:toca, hits}], ataque:null, apunta:null, pts, fallos:{...(g.fallos || {1:0,2:0}), [a.p]:0}, ...avanzar(g, pts)};
      if (gana){ patch.estado = "fin"; patch.ganador = a.p; }
      tx.update(ref, patch);
    });
  } catch (e){ console.error(e); }
  resolviendo = false;
}
async function pasar(){             // se acabó el tiempo: se pierde el ataque
  if (pasando || (G && G.pausa && ["pausada","reanudar"].includes(G.pausa.estado))) return; pasando = true;
  try { await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
    if (g.estado !== "batalla" || g.pausa && ["pausada","reanudar"].includes(g.pausa.estado) || g.ataque || Date.now() < g.tiempoFin) return;
    const f = {...(g.fallos || {1:0,2:0})}; f[g.turno] = (f[g.turno] || 0) + 1;
    const patch = {...avanzar(g, g.pts), apunta:null, fallos:f};
    if (f[g.turno] >= 3){ patch.estado = "fin"; patch.ganador = 3 - g.turno; patch.abandonoPor = g.turno; }   // 3 turnos seguidos sin atacar
    tx.update(ref, patch);
  }); } catch {}
  pasando = false;
}
const COLOCAR_MS = 300000;   // 5 minutos para colocar la flota
async function cancelarColocacion(){
  if (pasando) return; pasando = true;
  try { await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
    if (g.estado !== "colocando" || g.pausa && ["pausada","reanudar"].includes(g.pausa.estado) || !g.inicio || Date.now() - g.inicio <= COLOCAR_MS) return;
    const l = g.listo || {}, a = !!l[g.j1], b = !!l[g.j2];
    if (a === b) tx.update(ref, {estado:"fin", cancelada:true, ganador:0});                    // nadie terminó: se cancela
    else tx.update(ref, {estado:"fin", ganador:a ? 1 : 2, abandonoPor:a ? 2 : 1});            // gana quien sí terminó
  }); } catch {}
  pasando = false;
}
async function abandonar(){
  if (!confirm("¿Seguro que quieres abandonar? Perderás la partida.")) return;
  try { await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), g = (await tx.get(ref)).data();
    if (g.estado === "fin") return;
    tx.update(ref, {estado:"fin", ganador:3 - yo, abandonoPor:yo, ataque:null, apunta:null, [`finales.${U.uid}`]:{ships:mis, gast:[...gast]}});
  }); publicado = true; } catch {}
}
setInterval(() => {
  if (!G || !G.j2) return;
  const e = $("tm");
  if (G.pausa && ["pausada","reanudar"].includes(G.pausa.estado)) return;
  if (G.estado === "colocando" && G.inicio){
    const r = Math.ceil((G.inicio + COLOCAR_MS - Date.now()) / 1000);
    if (e) e.textContent = fmtT(r);
    if (r <= 0) cancelarColocacion();
    return;
  }
  if (G.estado !== "batalla") return;
  const r = Math.ceil((G.tiempoFin - Date.now()) / 1000);
  if (e) e.textContent = fmtT(r);
  if (!G.ataque && ((G.turno === yo && r <= 0) || r <= -4)) pasar();
}, 1000);

async function solicitarPausa(){
  await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), s = await tx.get(ref);
    if (!s.exists()) throw new Error("La partida ya no existe.");
    const g = s.data();
    if (!g.jugadores || !g.jugadores.includes(U.uid) || !g.j2) throw new Error("No puedes pausar esta partida.");
    if (!["colocando","batalla"].includes(g.estado) || g.pausa) return;
    tx.update(ref, {pausa:{estado:"solicitada", solicitadaPor:U.uid, confirmaciones:{[U.uid]:true}, creada:Date.now()}});
  });
}
async function confirmarPausa(){
  await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), s = await tx.get(ref);
    if (!s.exists()) throw new Error("La partida ya no existe.");
    const g = s.data(), pa = g.pausa || {};
    if (!["colocando","batalla"].includes(g.estado) || pa.estado !== "solicitada" || pa.solicitadaPor === U.uid) return;
    const ahora = Date.now(), restante = g.estado === "batalla"
      ? Math.max(0, (g.tiempoFin || ahora) - ahora)
      : Math.max(0, (g.inicio || ahora) + COLOCAR_MS - ahora);
    tx.update(ref, {pausa:{estado:"pausada", solicitadaPor:pa.solicitadaPor,
      confirmaciones:{...(pa.confirmaciones || {}), [U.uid]:true}, restante,
      tipo:g.estado, pausadaEn:ahora}});
  });
}
async function reanudarPartida(){
  await runTransaction(db, async tx => {
    const ref = doc(db,"games",gid), s = await tx.get(ref);
    if (!s.exists()) throw new Error("La partida ya no existe.");
    const g = s.data(), pa = g.pausa || {};
    if (!["pausada","reanudar"].includes(pa.estado)) return;
    const confirmaciones = {...(pa.confirmacionesReanudar || {}), [U.uid]:true};
    if (!confirmaciones[g.j1] || !confirmaciones[g.j2]){
      tx.update(ref, {pausa:{...pa, estado:"reanudar", confirmacionesReanudar:confirmaciones}});
      return;
    }
    const restante = Math.max(0, Number(pa.restante) || 0), ahora = Date.now(), patch = {pausa:null};
    if (pa.tipo === "batalla") patch.tiempoFin = ahora + restante;
    if (pa.tipo === "colocando") patch.inicio = ahora + restante - COLOCAR_MS;
    tx.update(ref, {...patch});
  });
}

async function guardarFin(){
  const g = G, f = g.finales, mio = f[U.uid], rv = f[yo === 1 ? g.j2 : g.j1] || {ships:[], gast:[]};
  const res = g.ganador === 0 ? "empate" : g.ganador === yo ? "victoria" : "derrota", ref = doc(db,"users",U.uid,"historial",gid);
  const flota = F => F.ships.map(s => ({c:CL[s.i].c, celdas:s.celdas, hund:!!s.hund})), sol = l => ({m:l.m, b:l.b, rojo:l.rojo});
  try {
    const registro = {resultado:res, rivalNombre:yo === 1 ? g.n2 : g.n1, miPuntaje:g.pts[yo], puntajeRival:g.pts[3-yo],
      mios:g.lineas.filter(l => l.p === yo).map(sol), rival:g.lineas.filter(l => l.p !== yo).map(sol),
      barcos:flota(mio), gast:mio.gast, barcosRival:flota(rv), gastRival:rv.gast, abandono:!!g.abandonoPor, fecha:serverTimestamp()};
    const perfilRef = doc(db,"users",U.uid), campo = {victoria:"victorias", derrota:"derrotas", empate:"empates"}[res];
    // Historial y estadísticas se escriben juntos: evita contar dos veces
    // una partida si llegan varias actualizaciones o se recarga la página.
    await runTransaction(db, async tx => {
      const [anterior, perfil] = await Promise.all([tx.get(ref), tx.get(perfilRef)]);
      if (anterior.exists()) return;
      const datos = perfil.data() || {};
      tx.set(ref, registro);
      tx.set(perfilRef, { [campo]: (datos[campo] || 0) + 1, puntos:(datos.puntos || 0) + g.pts[yo], mejor:Math.max(datos.mejor || 0, g.pts[yo]) }, {merge:true});
    });
  } catch (e){ console.error(e); }
}

function pintarSala(id, g){
  $("v-sala").innerHTML = `<div class="card"><h2 style="margin-top:0">Sala de espera</h2><small>Código de la partida</small><div class="code">${esc(id)}</div>
    <p>Jugador 1: ${esc(g.n1)}<br>Jugador 2: ${esc(g.n2 || "esperando rival…")}</p>
    <p><b>${g.j2 ? "¡Los dos jugadores están dentro! El siguiente paso es colocar los barcos." : "Comparte el código con tu rival."}</b></p></div>
    <button class="sec" data-go="partidas">Volver a mis partidas</button>`;
}
function abrirSala(id){
  if (salaSub){ salaSub(); salaSub = null; }
  ir("sala");
  gid = null; salaSub = onSnapshot(doc(db,"games",id), s => { if (s.exists()) alCambiar(id, s.data()); });
}

/* ---------- Acciones (delegación de eventos) ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t || !U) return;
  const d = t.dataset;
  try {
    if (d.go) return ir(d.go);
    if (d.sala) return abrirSala(d.sala);
    if (d.histPage){ paginaHistorial = Math.max(0, paginaHistorial + Number(d.histPage)); return pintarPerfil(); }
    if (t.id === "bCrear"){
      let id = "", creada = false;
      // Se reserva el identificador de forma atómica para no sobrescribir otra sala.
      for (let intento = 0; intento < 8 && !creada; intento++){
        const candidato = cod(5), ref = doc(db,"games",candidato);
        creada = await runTransaction(db, async tx => {
          const existente = await tx.get(ref);
          if (existente.exists()) return false;
          tx.set(ref, {j1:U.uid, n1:nombre(), j2:null, n2:null, jugadores:[U.uid], estado:"esperando", lineas:[], listo:{}, pts:{1:0,2:0}, creada:serverTimestamp()});
          return true;
        });
        if (creada) id = candidato;
      }
      if (!creada) throw new Error("No se pudo generar un código. Inténtalo de nuevo.");
      return abrirSala(id);
    }
    if (t.id === "bUnir"){
      const id = $("codigo").value.trim().toUpperCase(), er = $("eInicio");
      if (!/^[A-HJ-NP-Z2-9]{5}$/.test(id)){ er.textContent = "El código debe tener 5 caracteres válidos."; return; }
      const ref = doc(db,"games",id);
      const resultado = await runTransaction(db, async tx => {
        const s = await tx.get(ref);
        if (!s.exists()) return "missing";
        const g = s.data();
        if (g.j1 === U.uid || g.j2 === U.uid) return "joined";
        if (g.estado !== "esperando" || g.j2) return "full";
        tx.update(ref, {j2:U.uid, n2:nombre(), estado:"colocando", jugadores:arrayUnion(U.uid), lineas:[], listo:{}, pts:{1:0,2:0}, turno:1, ronda:1, fallos:{1:0,2:0}, inicio:Date.now()});
        return "joined";
      });
      if (resultado === "missing"){ er.textContent = "No existe una partida con ese código."; return; }
      if (resultado === "full"){ er.textContent = "Esa partida ya está llena o ya comenzó."; return; }
      return abrirSala(id);
    }
    if (t.id === "bAmigo"){
      const c = $("cAmigo").value.trim().toUpperCase(); msgAmigo = "";
      if (c.length !== 6) msgAmigo = "El código tiene 6 caracteres.";
      else {
        const s = await getDoc(doc(db,"codigos",c));
        if (!s.exists()) msgAmigo = "No existe ese código.";
        else if (s.data().uid === U.uid) msgAmigo = "Ese código es el tuyo.";
        else {
          const o = s.data(), id = [U.uid, o.uid].sort().join("_"), ref = doc(db,"amistades",id);
          const estado = await runTransaction(db, async tx => {
            const existente = await tx.get(ref);
            if (existente.exists()) return existente.data().estado === "aceptada" ? "friends" : "pending";
            tx.set(ref, {miembros:[U.uid,o.uid], nombres:{[U.uid]:nombre(), [o.uid]:o.nombre || "Jugador"}, pedidoPor:U.uid, estado:"pendiente", creada:serverTimestamp()});
            return "sent";
          });
          msgAmigo = estado === "friends" ? "Ya son amigos." : estado === "pending" ? "Ya existe una solicitud pendiente entre ustedes." : "✓ Solicitud enviada a " + (o.nombre || "tu amigo");
        }
      }
      return pintarAmigos();
    }
    if (d.acep) return await updateDoc(doc(db,"amistades",d.acep), {estado:"aceptada"});
    if (d.del){
      const relacion = amistades.find(a => a.id === d.del);
      if (!relacion) return;
      const amigoNombre = relacion.nombres?.[otro(relacion)] || "este jugador";
      const esAmistad = relacion.estado === "aceptada";
      const pregunta = esAmistad
        ? `¿Seguro que quieres cancelar la amistad con ${amigoNombre}?

Ya no aparecerá en tu lista de amigos.`
        : relacion.pedidoPor === U.uid
          ? `¿Quieres cancelar la solicitud de amistad enviada a ${amigoNombre}?`
          : `¿Quieres rechazar la solicitud de amistad de ${amigoNombre}?`;
      if (!window.confirm(pregunta)) return;
      await deleteDoc(doc(db,"amistades",d.del));
      return;
    }
    if (t.id === "bNombre"){
      const n = $("pNombre").value.trim(); if (n.length < 3){ $("ePerfil").textContent = ERR.nombre; return; }
      await updateProfile(U, {displayName:n});
      await updateDoc(doc(db,"users",U.uid), {nombre:n});
      if (P.codigo) await updateDoc(doc(db,"codigos",P.codigo), {nombre:n});
      $("ePerfil").textContent = ""; return pintar();
    }
    if (t.id === "bCopiar"){ try { await navigator.clipboard.writeText(P.codigo || ""); t.textContent = "¡Copiado!"; } catch { t.textContent = P.codigo || ""; } return; }
    if (t.id === "bEjemplo") return await ejemplo();
    if (t.id === "solicitarPausa") return await solicitarPausa();
    if (t.id === "confirmarPausa") return await confirmarPausa();
    if (t.id === "reanudarPartida") return await reanudarPartida();
    if (t.id === "bSalir") return signOut(auth);
  } catch (er){
    const x = $("eInicio") || $("ePerfil"); if (vista === "amigos"){ msgAmigo = texto(er); pintarAmigos(); } else if (x) x.textContent = texto(er);
  }
});
</script>
